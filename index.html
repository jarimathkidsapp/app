<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>JariMath Kids — Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#E31183; --pink-d:#B80D69; --pink-50:#FDE8F3; --pink-100:#FBD3E8;
  --yellow:#FFC928; --yellow-d:#B98A00; --yellow-50:#FFF6D9;
  --green:#18A058; --green-50:#DDF7E8;
  --blue:#2F7BEA; --blue-50:#DFEBFF;
  --purple:#7A4BD8; --purple-50:#EEE6FF;
  --orange:#FF8A3D; --orange-50:#FFEBDD;
  --red:#E5484D; --red-50:#FDECEC;
  --ink:#2D2A4A; --ink-2:#5A5775; --muted:#8E8BA6; --line:#F0E3EC;
  --bg:#FFF7FB; --card:#FFFFFF;
  --r:18px; --r-sm:12px;
  --shadow:0 2px 0 rgba(45,42,74,.04), 0 8px 24px -12px rgba(227,17,131,.18);
  --font-h:'Fredoka', 'Nunito', system-ui, sans-serif;
  --font-b:'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
h1,h2,h3,h4{font-family:var(--font-h);font-weight:600;line-height:1.2;letter-spacing:.1px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--pink);text-decoration:none}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.nowrap{white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}}
@media(max-width:560px){.g2.keep{grid-template-columns:repeat(2,minmax(0,1fr))}.g2:not(.keep){grid-template-columns:1fr}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:999px;font-weight:800;font-size:14px;background:var(--pink);color:#fff;box-shadow:0 3px 0 var(--pink-d);transition:transform .08s, filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--pink-d)}
.btn svg{width:17px;height:17px}
.btn.sm{padding:6px 12px;font-size:13px;box-shadow:0 2px 0 var(--pink-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line),0 2px 0 var(--line)}
.btn.yellow{background:var(--yellow);color:var(--ink);box-shadow:0 3px 0 var(--yellow-d)}
.btn.green{background:var(--green);box-shadow:0 3px 0 #0E7A41}
.btn.wa{background:#25D366;box-shadow:0 3px 0 #179C4A}
.btn.red{background:var(--red);box-shadow:0 3px 0 #B4282D}
.btn.block{width:100%}
.btn:disabled{opacity:.55;pointer-events:none}
.icon-btn{width:36px;height:36px;border-radius:12px;display:inline-grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{background:var(--pink-50);color:var(--pink)}
.icon-btn svg{width:20px;height:20px}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:800;color:var(--ink-2)}
.input,select.input,textarea.input{width:100%;padding:10px 13px;border-radius:12px;border:1.5px solid var(--line);background:#fff;outline:none;transition:border-color .15s, box-shadow .15s}
.input:focus{border-color:var(--pink);box-shadow:0 0 0 4px var(--pink-50)}
textarea.input{min-height:84px;resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
@media(max-width:560px){.form-grid{grid-template-columns:1fr}}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid #F8EAF2;padding:18px}
.card h3{font-size:18px;margin-bottom:10px}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-head h3{margin:0}
.stat{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .lbl{font-size:13px;font-weight:700;color:var(--ink-2)}
.stat .val{font-family:var(--font-h);font-size:26px;font-weight:600;line-height:1.1}
.stat .sub{font-size:12px;color:var(--ink-2)}
.bg-pink{background:var(--pink-50)} .bg-yellow{background:var(--yellow-50)} .bg-green{background:var(--green-50)} .bg-blue{background:var(--blue-50)} .bg-purple{background:var(--purple-50)} .bg-orange{background:var(--orange-50)} .bg-red{background:var(--red-50)}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.b-green{background:var(--green-50);color:#0E7A41}
.b-red{background:var(--red-50);color:#B4282D}
.b-yellow{background:var(--yellow-50);color:#8A6500}
.b-blue{background:var(--blue-50);color:#1D5DBF}
.b-pink{background:var(--pink-50);color:var(--pink-d)}
.b-purple{background:var(--purple-50);color:#5B32B0}
.b-gray{background:#F1EFF5;color:var(--ink-2)}

/* ---------- table ---------- */
.table-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:800;padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tr.unpaid td{background:#FFF4F4}
.t tr.unpaid td:first-child{box-shadow:inset 4px 0 0 var(--red)}
.t .c{text-align:center}
.t .r{text-align:right}

/* ---------- tabs / chips ---------- */
.tabs{display:flex;gap:6px;background:#fff;padding:5px;border-radius:999px;box-shadow:var(--shadow);overflow-x:auto;max-width:100%;scrollbar-width:none}
.tabs button{padding:8px 16px;border-radius:999px;font-weight:800;font-size:14px;color:var(--ink-2);white-space:nowrap}
.tabs button.on{background:var(--pink);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 13px;border-radius:999px;font-weight:800;font-size:13px;background:#fff;border:1.5px solid var(--line);color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:
  radial-gradient(circle at 12% 18%, var(--yellow-50) 0 120px, transparent 121px),
  radial-gradient(circle at 88% 82%, var(--blue-50) 0 160px, transparent 161px),
  radial-gradient(circle at 90% 10%, var(--pink-100) 0 90px, transparent 91px), var(--bg)}
.login-card{width:100%;max-width:410px;background:#fff;border-radius:28px;padding:28px 24px;box-shadow:0 20px 50px -24px rgba(227,17,131,.45);text-align:center}
.login-card .logo{width:132px;height:132px;margin:-4px auto 8px;display:block}
.login-card h1{font-size:24px}
.login-card .tabs{margin:18px 0 16px;justify-content:center}
.login-card .tabs button{flex:1}
.login-card form{display:flex;flex-direction:column;gap:12px;text-align:left}
.login-hint{font-size:13px;color:var(--muted);text-align:center;margin-top:12px}
.demo-box{margin-top:16px;background:var(--yellow-50);border-radius:14px;padding:10px 12px;font-size:12.5px;text-align:left;color:#6B5200}
.demo-box b{color:var(--ink)}

/* ---------- app shell ---------- */
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px}
.brand img{width:46px;height:46px}
.brand b{font-family:var(--font-h);font-size:18px;display:block;line-height:1.1;color:var(--pink)}
.brand span{font-size:12px;color:var(--muted)}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:14px;font-weight:700;color:var(--ink-2);text-align:left;width:100%}
.nav-item svg{width:20px;height:20px;flex-shrink:0}
.nav-item:hover{background:var(--pink-50);color:var(--pink)}
.nav-item.on{background:var(--pink);color:#fff}
.nav-item .cnt{margin-left:auto;background:var(--red);color:#fff;font-size:11px;padding:1px 7px;border-radius:999px}
.nav-item.on .cnt{background:#fff;color:var(--red)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 26px;position:sticky;top:0;z-index:20;background:rgba(255,247,251,.9);backdrop-filter:blur(8px)}
.topbar h2{font-size:22px}
.topbar .menu-btn{display:none}
.content{padding:6px 26px 40px;display:flex;flex-direction:column;gap:16px;max-width:1240px;width:100%}
.user-pill{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:5px 6px 5px 14px;box-shadow:var(--shadow);font-weight:700;font-size:13px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-family:var(--font-h);font-weight:700;color:var(--ink);font-size:14px;flex-shrink:0}
.mode-flag{position:fixed;bottom:12px;right:12px;pointer-events:none;z-index:80;background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;opacity:.9}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:60;transform:translateX(-105%);transition:transform .22s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(45,42,74,.35);z-index:55}
  .topbar{padding:12px 16px}
  .topbar .menu-btn{display:inline-grid}
  .topbar h2{font-size:19px}
  .user-pill .nm{display:none}
  .content{padding:4px 16px 40px}
}

/* ---------- home hero + tiles (seperti brief) ---------- */
.hero{background:var(--pink-50);border-radius:22px;padding:20px;display:flex;gap:16px;align-items:center;position:relative;overflow:hidden}
.hero img{width:84px;height:84px;flex-shrink:0}
.hero h2{color:var(--pink-d);font-size:23px}
.hero p{color:var(--pink-d);opacity:.85}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:var(--pink-100);opacity:.6}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{border-radius:18px;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:800;color:var(--ink);text-align:center;transition:transform .12s}
.tile:hover{transform:translateY(-2px)}
.tile svg{width:30px;height:30px;color:var(--pink-d)}
@media(max-width:560px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.tile{padding:13px 6px;font-size:12.5px;line-height:1.25}.tile svg{width:25px;height:25px}.hero{padding:16px;gap:12px}.hero img{width:56px;height:56px}.hero h2{font-size:19px}.hero p{font-size:13.5px}}
.tiles.desktop-hide{display:none}
@media(max-width:900px){.tiles.desktop-hide{display:grid}}

/* list items */
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .meta{min-width:0;flex:1}
.li .meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:26px 10px;text-align:center;color:var(--muted);font-weight:600}

/* status segmented (absensi) */
.seg{display:inline-flex;background:#F6F1F5;border-radius:12px;padding:3px;gap:2px}
.seg button{min-width:38px;padding:6px 9px;border-radius:9px;font-weight:800;font-size:13px;color:var(--ink-2)}
.seg button.on.H{background:var(--green);color:#fff}
.seg button.on.I{background:var(--blue);color:#fff}
.seg button.on.S{background:var(--orange);color:#fff}
.seg button.on.A{background:var(--red);color:#fff}

/* jadwal */
.days{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media(max-width:900px){.days{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.days{grid-template-columns:1fr}}
.day{border-radius:18px;padding:14px;background:#fff;box-shadow:var(--shadow)}
.day h4{font-size:16px;padding:6px 12px;border-radius:12px;margin-bottom:10px;display:flex;align-items:center}
.sess{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.sess:hover{border-color:var(--pink-100)}
.sess .time{font-weight:800;font-size:13px}

/* rekap grid */
.cell-ok{color:#0E7A41;font-weight:800}
.cell-no{color:#B4282D;font-weight:800;background:var(--red-50)}
.cell-na{color:#C9C5D6}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(45,42,74,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow-y:auto}
.modal{background:#fff;border-radius:22px;width:100%;max-width:560px;box-shadow:0 30px 60px -20px rgba(0,0,0,.35);animation:pop .18s ease-out}
.modal.wide{max-width:760px}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:19px;flex:1}
.modal-b{padding:18px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-weight:700;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.toast.err{background:var(--red)}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:rgba(255,247,251,.6);z-index:150}
.spin{width:44px;height:44px;border-radius:50%;border:5px solid var(--pink-100);border-top-color:var(--pink);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* invoice preview */
.inv{font-family:var(--font-b);color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:22px;position:relative;overflow:hidden}
.inv-h{display:flex;gap:12px;align-items:center;border-bottom:2px dashed var(--pink-100);padding-bottom:14px;margin-bottom:14px}
.inv-h img{width:64px;height:64px}
.inv-h h2{font-size:20px;color:var(--pink)}
.inv table{width:100%;border-collapse:collapse;font-size:14px}
.inv td{padding:6px 0;vertical-align:top}
.inv .tot{font-family:var(--font-h);font-size:24px;color:var(--pink)}
.stamp{position:absolute;right:18px;top:92px;transform:rotate(-12deg);border:3px solid;border-radius:10px;padding:4px 12px;font-family:var(--font-h);font-weight:700;font-size:20px;letter-spacing:1px;opacity:.85}
.stamp.paid{color:var(--green);border-color:var(--green)}
.stamp.unpaid{color:var(--red);border-color:var(--red)}

/* ---------- murid ---------- */
.kid-top{display:flex;align-items:center;gap:10px;padding:14px 16px;max-width:880px;margin:0 auto;width:100%}
.kid-top img{width:48px;height:48px}
.kid-wrap{max-width:880px;margin:0 auto;padding:0 16px 40px;display:flex;flex-direction:column;gap:16px;width:100%}
.star-pill{display:inline-flex;align-items:center;gap:6px;background:var(--yellow);border-radius:999px;padding:6px 14px;font-family:var(--font-h);font-weight:700;font-size:18px;box-shadow:0 3px 0 var(--yellow-d)}
.kid-hero{border-radius:26px;padding:22px;background:linear-gradient(135deg,var(--pink) 0%,#F0479F 100%);color:#fff;display:flex;gap:16px;align-items:center;position:relative;overflow:hidden}
.kid-hero h2{font-size:26px}
.kid-hero .lv{display:inline-block;margin-top:8px;background:rgba(255,255,255,.22);padding:4px 12px;border-radius:999px;font-weight:800;font-size:13px}
.kid-hero .big-emoji{font-size:60px;line-height:1}
.levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:560px){.levels{grid-template-columns:1fr}}
.level-card{border-radius:22px;padding:18px;text-align:left;display:flex;gap:14px;align-items:center;transition:transform .12s;position:relative;border:2.5px solid transparent}
.level-card:hover{transform:translateY(-2px)}
.level-card .n{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font-family:var(--font-h);font-size:30px;font-weight:700;color:#fff;flex-shrink:0;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.level-card h3{font-size:18px}
.level-card p{font-size:13px;color:var(--ink-2)}
.level-card.locked{opacity:.55;filter:grayscale(.6);cursor:not-allowed}
.level-card .lock{position:absolute;right:14px;top:12px;font-size:18px}
.quiz{background:#fff;border-radius:26px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;max-width:460px;margin:0 auto;width:100%}
.dots{display:flex;gap:5px}
.dots i{flex:1;height:8px;border-radius:9px;background:#F1E8EE}
.dots i.ok{background:var(--green)} .dots i.no{background:var(--red)} .dots i.cur{background:var(--yellow)}
.q-box{text-align:center;padding:18px 8px;border-radius:20px;background:var(--yellow-50)}
.q-text{font-family:var(--font-h);font-size:46px;font-weight:700;color:var(--ink);letter-spacing:1px}
.q-ans{margin-top:8px;font-family:var(--font-h);font-size:38px;font-weight:700;min-height:52px;color:var(--pink);background:#fff;border-radius:14px;border:2.5px dashed var(--pink-100);padding:2px 10px}
.q-box.right{background:var(--green-50)} .q-box.wrong{background:var(--red-50);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.keypad button{height:58px;border-radius:16px;background:#fff;border:2px solid var(--line);font-family:var(--font-h);font-size:26px;font-weight:600;box-shadow:0 3px 0 var(--line)}
.keypad button:active{transform:translateY(2px);box-shadow:none}
.keypad .ok{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 3px 0 #0E7A41}
.keypad .del{background:var(--pink-50);color:var(--pink-d)}
.result{text-align:center;padding:10px}
.result .stars{font-size:54px;letter-spacing:6px;margin:6px 0}
.result .stars span{display:inline-block;animation:starpop .5s both}
.result .stars span.off{filter:grayscale(1);opacity:.25}
@keyframes starpop{from{transform:scale(0) rotate(-60deg)}70%{transform:scale(1.3)}}
.score-big{font-family:var(--font-h);font-size:64px;color:var(--pink);font-weight:700;line-height:1}

/* print */
@media print{
  body *{visibility:hidden}
  .print-area,.print-area *{visibility:visible}
  .print-area{position:absolute;left:0;top:0;width:100%}

const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
const DEMO = !IS_GAS && !CONFIG.API_URL;

const S = { token: null, role: null, profile: null, db: {}, settings: {}, me: null, page: 'dashboard', tab: {}, f: {} };

/* ---------------- storage aman ---------------- */
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/* ---------------- API ---------------- */
async function call(action, payload = {}, opts = {}) {
  const req = Object.assign({ action, token: S.token }, payload);
  if (!opts.silent) loading(true);
  try {
    let res;
    if (IS_GAS) {
      res = await new Promise((ok, ko) => google.script.run.withSuccessHandler(r => ok(JSON.parse(r))).withFailureHandler(ko).api(JSON.stringify(req)));
    } else if (DEMO) {
      await new Promise(r => setTimeout(r, 120));
      res = Mock.handle(JSON.parse(JSON.stringify(req)));
    } else {
      const r = await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify(req) });
      res = await r.json();
    }
    if (!res.ok) {
      if (res.error === 'SESSION') { logout(true); }
      throw new Error(res.message || res.error || 'Terjadi kesalahan');
    }
    return res;
  } finally { if (!opts.silent) loading(false); }
}

/* ---------------- helpers ---------------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rp = n => 'Rp' + (Number(n) || 0).toLocaleString('id-ID');
const pad = n => String(n).padStart(2, '0');
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const thisPeriod = () => todayStr().slice(0, 7);
const fmtDate = s => { if (!s) return '-'; const [y, m, d] = String(s).split('-'); return d ? `${+d} ${BULAN[+m - 1].slice(0, 3)} ${y}` : s; };
const fmtDateLong = s => { if (!s) return '-'; const [y, m, d] = String(s).split('-'); return `${+d} ${BULAN[+m - 1]} ${y}`; };
const fmtPeriod = p => { if (!p) return '-'; const [y, m] = p.split('-'); return `${BULAN[+m - 1]} ${y}`; };
const addMonths = (p, n) => { let [y, m] = p.split('-').map(Number); m += n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return `${y}-${pad(m)}`; };
const dayName = s => HARI[new Date(s + 'T00:00:00').getDay()];
const initials = n => String(n || '?').trim().split(/\s+/).slice(0, 2).map(x => x[0]).join('').toUpperCase();
const sum = (arr, f) => arr.reduce((a, x) => a + (Number(f(x)) || 0), 0);
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const rand4 = () => String(Math.floor(1000 + Math.random() * 9000));
function waNum(n) { n = String(n || '').replace(/\D/g, ''); if (n.startsWith('0')) n = '62' + n.slice(1); else if (n.startsWith('8')) n = '62' + n; return n; }
function waLink(n, text) { return `https://wa.me/${waNum(n)}?text=${encodeURIComponent(text)}`; }
function openWa(n, text) { if (!waNum(n)) return toast('Nomor WhatsApp belum diisi', true); window.open(waLink(n, text), '_blank'); }
function formData(form) { const o = {}; new FormData(form).forEach((v, k) => o[k] = String(v).trim()); return o; }
function monthOptions(sel, back = 12, fwd = 1) {
  const cur = thisPeriod(); let out = '';
  for (let i = fwd; i >= -back; i--) { const p = addMonths(cur, i); out += `<option value="${p}" ${p === sel ? 'selected' : ''}>${fmtPeriod(p)}</option>`; }
  return out;
}
function downloadFile(name, content, type = 'text/csv;charset=utf-8') {
  try {
    const blob = new Blob(['﻿' + content], { type });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e) { toast('Unduhan tidak didukung di tampilan ini', true); }
}
function toCSV(rows) { return rows.map(r => r.map(v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`).join(',')).join('\n'); }

/* ---------------- UI primitives ---------------- */
let toastT;
function toast(msg, err) {
  let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', 2800);
}
let loadingN = 0;
function loading(on) {
  loadingN += on ? 1 : -1; if (loadingN < 0) loadingN = 0;
  let l = $('#loading'); if (!l) { l = document.createElement('div'); l.id = 'loading'; l.className = 'loading hidden'; l.innerHTML = '<div class="spin"></div>'; document.body.appendChild(l); }
  l.classList.toggle('hidden', loadingN === 0);
}
function modal(title, body, foot = '', wide = false) {
  closeModal();
  const m = document.createElement('div'); m.className = 'modal-bg'; m.id = 'modal';
  m.innerHTML = `<div class="modal ${wide ? 'wide' : ''}"><div class="modal-h"><h3>${title}</h3><button class="icon-btn" onclick="closeModal()">${ic('x')}</button></div><div class="modal-b">${body}</div>${foot ? `<div class="modal-f">${foot}</div>` : ''}</div>`;
  m.addEventListener('mousedown', e => { if (e.target === m) closeModal(); });
  document.body.appendChild(m);
  const f = m.querySelector('input:not([type=hidden]),select,textarea'); if (f && window.innerWidth > 700) setTimeout(() => f.focus(), 50);
}
function closeModal() { const m = $('#modal'); if (m) m.remove(); }
function confirmBox(msg, onYes, yesLabel = 'Ya, hapus') {
  window.__yes = () => { closeModal(); onYes(); };
  modal('Konfirmasi', `<p>${msg}</p>`, `<button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn red" onclick="__yes()">${yesLabel}</button>`);
}
function printHtml(inner, title = 'Cetak') {
  const css = $('style').outerHTML;
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(title)}</title><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">${css}<style>body{background:#fff;padding:24px}@media print{body{padding:0}.inv{border:0}}</style></head><body><div style="max-width:720px;margin:0 auto">${inner}</div><script>setTimeout(function(){window.print()},700)<\/script></body></html>`;
  const w = window.open('', '_blank');
  if (w) { w.document.open(); w.document.write(html); w.document.close(); }
  else {
    const d = document.createElement('div'); d.className = 'print-area'; d.innerHTML = inner; document.body.appendChild(d);
    window.print(); setTimeout(() => d.remove(), 500);
  }
}

const LEVELS = [
  { n: 1, judul: 'Level 1 — Satuan', desc: 'Penjumlahan & pengurangan 1–9', color: 'var(--pink)', bg: 'var(--pink-50)', tip: 'Jari kanan = satuan. Telunjuk 1, jari tengah 2, jari manis 3, kelingking 4, jempol 5. Tambah = buka jari, kurang = tutup jari.' },
  { n: 2, judul: 'Level 2 — Puluhan', desc: 'Penjumlahan & pengurangan 10–99', color: '#E0A800', bg: 'var(--yellow-50)', tip: 'Jari kiri = puluhan, jari kanan = satuan. Hitung satuan dulu, lalu puluhan.' },
  { n: 3, judul: 'Level 3 — Perkalian', desc: 'Perkalian 1–10 dengan jari', color: 'var(--green)', bg: 'var(--green-50)', tip: 'Perkalian 6–10: jari yang dibuka = puluhan, jari tertutup kiri × kanan = satuan.' },
  { n: 4, judul: 'Level 4 — Pembagian & Campuran', desc: 'Pembagian & operasi campuran', color: 'var(--blue)', bg: 'var(--blue-50)', tip: 'Pembagian = kebalikan perkalian. Cari angka yang jika dikali pembagi hasilnya sama.' }
];
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
function genSoal(level) {
  let a, b, c, q, ans;
  if (level == 1) {
    if (Math.random() < .55) { a = ri(1, 9); b = ri(1, 9); q = `${a} + ${b}`; ans = a + b; }
    else { a = ri(2, 18); b = ri(1, Math.min(9, a)); q = `${a} − ${b}`; ans = a - b; }
  } else if (level == 2) {
    if (Math.random() < .55) { a = ri(10, 89); b = ri(10, 99 - a > 10 ? 99 - a : 10); q = `${a} + ${b}`; ans = a + b; }
    else { a = ri(20, 99); b = ri(10, a); q = `${a} − ${b}`; ans = a - b; }
  } else if (level == 3) {
    a = Math.random() < .6 ? ri(6, 10) : ri(2, 5); b = Math.random() < .6 ? ri(6, 10) : ri(1, 10);
    q = `${a} × ${b}`; ans = a * b;
  } else {
    if (Math.random() < .55) { b = ri(2, 10); c = ri(1, 10); a = b * c; q = `${a} ÷ ${b}`; ans = c; }
    else { a = ri(10, 50); b = ri(5, 40); c = ri(1, Math.min(30, a + b)); q = `${a} + ${b} − ${c}`; ans = a + b - c; }
  }
  return { q, ans: String(ans) };
}
function buildQuiz(level, bank, n = 10) {
  const pool = (bank || []).filter(s => String(s.level) === String(level) && s.aktif !== 'Tidak').sort(() => Math.random() - .5);
  const out = pool.slice(0, Math.min(5, pool.length)).map(s => ({ q: s.soal, ans: String(s.jawaban).trim() }));
  const seen = new Set(out.map(x => x.q));
  let guard = 0;
  while (out.length < n && guard++ < 200) { const g = genSoal(level); if (!seen.has(g.q)) { seen.add(g.q); out.push(g); } }
  return out.sort(() => Math.random() - .5);
}
const starsFor = skor => skor >= 90 ? 3 : skor >= 75 ? 2 : skor >= 60 ? 1 : 0;

function billablePeriods(s, upto = thisPeriod(), max = 12) {

  </div></div>`;
}
async function doLogin(e) {
  e.preventDefault();
  const f = formData(e.target);
  try {
    const r = await call('login', { role: S.loginRole, user: f.user, pass: f.pass });
    S.token = r.token; S.role = r.role; S.profile = r.profile;
    store.set('jmk_session', { token: r.token, role: r.role, profile: r.profile });
    await startApp();
  } catch (err) { toast(err.message, true); }
}
function logout(expired) {
  if (S.token && !expired) call('logout', {}, { silent: true }).catch(() => {});
  S.token = null; S.role = null; S.db = {}; S.me = null; S.page = 'dashboard';
  store.del('jmk_session'); closeModal();
  renderLogin();
  if (expired) toast('Sesi berakhir, silakan login kembali', true);
}
async function startApp() {
  if (S.role === 'admin') { const r = await call('bootstrap'); S.db = r.data.db; S.settings = r.data.settings; renderAdmin(); }
  else { const r = await call('me'); S.me = r.data; S.settings = r.data.settings; S.role === 'murid' ? renderMurid() : renderOrtu(); }
  if (DEMO && !$('.mode-flag')) { const f = document.createElement('div'); f.className = 'mode-flag'; f.textContent = 'MODE DEMO'; document.body.appendChild(f); }
}
async function init() {
  const sess = store.get('jmk_session');
  if (sess && sess.token) {
    Object.assign(S, { token: sess.token, role: sess.role, profile: sess.profile });
    try { await startApp(); return; } catch (e) { S.token = null; store.del('jmk_session'); }
  }
  renderLogin();
}

      { id: 'SO3', level: '3', soal: '7 × 8', jawaban: '56', aktif: 'Ya' }, { id: 'SO4', level: '4', soal: '63 ÷ 9', jawaban: '7', aktif: 'Ya' }
    ];
    const Laporan = [{ id: 'LP1', siswaId: 'JMK001', periode: prev, level: '3', hadir: '7', pertemuan: '8', rataNilai: '86', bintang: '9', pencapaian: 'Sudah lancar perkalian 6–10 dengan jari. Kecepatan meningkat.', catatanGuru: 'Aisyah sangat fokus dan rajin. Pertahankan latihan 10 menit setiap hari di rumah ya!', dibuat: prev + '-28' }];
    return {
      Siswa, Guru, Jadwal, Absensi, AbsensiGuru, SPP, Laporan, Nilai, Bintang, Soal,
      Users: [{ id: 'U1', username: 'admin', pass: 'jarimath123', nama: 'Admin JariMath', role: 'admin' }],
      Pengaturan: { namaLembaga: 'JariMath Kids', tagline: 'Berhitung Cepat dengan Jari Tangan', alamat: 'Jl. Contoh No. 12, Cirebon', noWa: '081234567890', nominalSPP: '150000', jatuhTempo: '10', tahunAjaran: '2026/2027', rekening: 'BCA 1234567890 a.n. JariMath Kids', pertemuanPerBulan: '8' }
    };
  }
  function db() { if (!mem) { mem = store.get(KEY) || seed(); save(); } return mem; }
  function save() { store.set(KEY, mem); }
  function sess(t) { return sessions[t] || (store.get('jmk_demo_sess') || {})[t]; }
  function newId(t, rows) {
    if (t === 'Siswa') { const m = Math.max(0, ...rows.map(r => parseInt(String(r.id).replace(/\D/g, ''), 10) || 0)); return 'JMK' + String(m + 1).padStart(3, '0'); }
    return uid(t.slice(0, 2).toUpperCase());
  }
  function upsert(t, row) {
    const rows = db()[t]; const r = Object.assign({}, row);
    Object.keys(r).forEach(k => r[k] = r[k] == null ? '' : String(r[k]));
    const i = r.id ? rows.findIndex(x => x.id === r.id) : -1;
    if (i > -1) rows[i] = Object.assign(rows[i], r);
    else { if (!r.id) r.id = newId(t, rows); if (t === 'SPP' && !r.noInvoice) r.noInvoice = invoiceNo(r.siswaId, r.periode); rows.push(r); }
    return r;
  }
  function pub(s) { const { namaLembaga, tagline, alamat, noWa, rekening, jatuhTempo, nominalSPP, tahunAjaran } = s; return { namaLembaga, tagline, alamat, noWa, rekening, jatuhTempo, nominalSPP, tahunAjaran }; }
  function handle(req) {
    const D = db(); const a = req.action;
    if (a === 'login') {
      let p = null;
      if (req.role === 'admin') { const u = D.Users.find(x => x.username.toLowerCase() === String(req.user).toLowerCase() && x.pass === req.pass); if (u) p = { id: u.id, nama: u.nama, username: u.username }; }
      else { const s = D.Siswa.find(x => x.id.toUpperCase() === String(req.user).toUpperCase()); const k = req.role === 'murid' ? 'pin' : 'kodeOrtu'; if (s && s[k] === req.pass && s.status !== 'Berhenti') p = { id: s.id, nama: s.nama, panggilan: s.panggilan }; }
      if (!p) return { ok: false, error: req.role === 'admin' ? 'Username atau password salah.' : 'ID siswa atau kode salah.' };
      const token = uid('T'); sessions[token] = { role: req.role, uid: p.id };
      const all = store.get('jmk_demo_sess') || {}; all[token] = sessions[token]; store.set('jmk_demo_sess', all);
      return { ok: true, token, role: req.role, profile: p };
    }
    const s = sess(req.token);
    if (!s) return { ok: false, error: 'SESSION' };
    if (a === 'logout') return { ok: true };
    if (s.role === 'admin') {
      if (a === 'bootstrap') { const o = {}; Object.keys(SCH).forEach(t => o[t] = D[t]); return { ok: true, data: { db: JSON.parse(JSON.stringify(o)), settings: Object.assign({}, D.Pengaturan) } }; }
      if (a === 'save') { const r = upsert(req.table, req.row); save(); return { ok: true, row: r }; }
      if (a === 'saveMany') { const rows = (req.rows || []).map(r => upsert(req.table, r)); save(); return { ok: true, rows }; }
      if (a === 'remove') { D[req.table] = D[req.table].filter(r => r.id !== req.id); save(); return { ok: true }; }
      if (a === 'saveSettings') { Object.assign(D.Pengaturan, req.settings); save(); return { ok: true, settings: D.Pengaturan }; }
      if (a === 'changePassword') { const u = D.Users.find(x => x.id === s.uid); if (u.pass !== req.oldPass) return { ok: false, error: 'Password lama salah.' }; if (String(req.newPass).length < 6) return { ok: false, error: 'Password baru minimal 6 karakter.' }; u.pass = req.newPass; save(); return { ok: true }; }
    } else {
      const sw = D.Siswa.find(x => x.id === s.uid);
      if (a === 'me') {
        const mine = t => D[t].filter(r => r.siswaId === s.uid);
        const safe = Object.assign({}, sw); delete safe.pin; delete safe.kodeOrtu;
        const jadwal = D.Jadwal.filter(j => j.siswaIds.split(',').includes(s.uid)).map(j => Object.assign({}, j, { guruNama: (D.Guru.find(g => g.id === j.guruId) || {}).nama || '' }));
        return { ok: true, data: JSON.parse(JSON.stringify({ role: s.role, siswa: safe, settings: pub(D.Pengaturan), Absensi: mine('Absensi'), SPP: s.role === 'ortu' ? mine('SPP') : [], Laporan: s.role === 'ortu' ? mine('Laporan') : [], Nilai: mine('Nilai'), Bintang: mine('Bintang'), Jadwal: jadwal, Soal: s.role === 'murid' ? D.Soal.filter(q => q.aktif !== 'Tidak') : [] })) };
      }
      if (a === 'submitQuiz' && s.role === 'murid') {
        const level = Math.max(1, Math.min(4, +req.level || 1));
        if (level > (+sw.level || 1)) return { ok: false, error: 'Level ini belum terbuka.' };
        const total = Math.max(1, Math.min(50, +req.total || 10)), benar = Math.max(0, Math.min(total, +req.benar || 0));
        const skor = Math.round(benar / total * 100), bintang = starsFor(skor), tg = todayStr();
        upsert('Nilai', { siswaId: s.uid, tanggal: tg, level, benar, total, skor, durasi: +req.durasi || 0, bintang });
        if (bintang) upsert('Bintang', { siswaId: s.uid, tanggal: tg, jumlah: bintang, tipe: 'Latihan', keterangan: `Latihan Level ${level} (skor ${skor})` });
        save(); return { ok: true, result: { skor, bintang } };
      }
    }
    return { ok: false, error: 'Akses ditolak' };
  }
  function reset() { store.del(KEY); mem = null; }
  return { handle, reset };
})();

const payOf = (sid, p) => D('SPP').find(x => x.siswaId === sid && x.periode === p);
const billedIn = (s, p) => s.status === 'Aktif' && (s.tglMulai || '0000').slice(0, 7) <= p;

function starTotal(sid, list = D('Bintang')) { return sum(list.filter(b => b.siswaId === sid), b => b.jumlah); }
function absMonth(sid, p, list = D('Absensi')) {
  const rows = list.filter(a => a.siswaId === sid && String(a.tanggal).startsWith(p));
  const c = { Hadir: 0, Izin: 0, Sakit: 0, Alpa: 0 }; rows.forEach(r => c[r.status] = (c[r.status] || 0) + 1);
  return { ...c, total: rows.length, rows };
}
function replaceRows(t, rows) { rows.forEach(r => { const i = D(t).findIndex(x => x.id === r.id); i > -1 ? D(t)[i] = r : D(t).push(r); }); }
async function saveRow(t, row) { const r = await call('save', { table: t, row }); replaceRows(t, [r.row]); return r.row; }
async function saveRows(t, rows) { const r = await call('saveMany', { table: t, rows }); replaceRows(t, r.rows); return r.rows; }
async function removeRow(t, id) { await call('remove', { table: t, id }); S.db[t] = D(t).filter(x => x.id !== id); }

/* ================= JADWAL ================= */
function pgJadwal() {
  const days = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
  if (D('Jadwal').some(j => j.hari === 'Minggu')) days.push('Minggu');
  const colors = ['bg-pink', 'bg-yellow', 'bg-green', 'bg-blue', 'bg-purple', 'bg-orange', 'bg-pink'];
  const today = dayName(todayStr());
  return `<div class="row"><p class="muted">Jadwal kelas reguler, privat & semiprivat. Klik sesi untuk mengubah.</p><div class="spacer"></div><button class="btn" onclick="formJadwal()">${ic('plus')} Tambah Jadwal</button></div>
  <div class="days">${days.map((d, i) => { const js = D('Jadwal').filter(j => j.hari === d).sort((a, b) => (a.jamMulai || '').localeCompare(b.jamMulai || '')); return `<div class="day">
    <h4 class="${colors[i]}">${d}${d === today ? '<span class="badge b-pink" style="margin-left:auto">Hari ini</span>' : ''}</h4>
    ${js.length ? js.map(j => { const ids = j.siswaIds ? j.siswaIds.split(',').map(x => x.trim()).filter(Boolean) : []; return `<div class="sess" onclick="formJadwal('${j.id}')">
      <div class="row" style="gap:6px"><span class="time">${ic('clock', '').replace('<svg', '<svg style="width:14px;height:14px;vertical-align:-2px"')} Sesi ${esc(j.sesi)} · ${esc(j.jamMulai)}–${esc(j.jamSelesai)}</span><div class="spacer"></div><span class="badge ${j.tipe === 'Privat' ? 'b-purple' : j.tipe === 'Semiprivat' ? 'b-blue' : 'b-yellow'}">${esc(j.tipe)}</span></div>
      <div class="small" style="margin-top:4px"><b>${esc(guruById(j.guruId).nama)}</b> · ${ids.length} siswa</div>
      <div class="small muted">${ids.map(x => esc(siswaById(x).panggilan || siswaById(x).nama)).join(', ') || '-'}</div></div>`; }).join('') : '<div class="small muted" style="padding:6px 4px">Tidak ada sesi</div>'}
  </div>`; }).join('')}</div>`;
}
function formJadwal(id) {
  const j = id ? D('Jadwal').find(x => x.id === id) : { hari: 'Senin', sesi: '1', jamMulai: '14:00', jamSelesai: '15:00', tipe: 'Reguler', siswaIds: '' };

    <div class="field"><label>Sesi</label><select class="input" name="sesi">${opt([1, 2, 3, 4, 5], j.sesi)}</select></div>
    <div class="field"><label>Jam mulai</label><input class="input" type="time" name="jamMulai" value="${esc(j.jamMulai)}"></div>
    <div class="field"><label>Jam selesai</label><input class="input" type="time" name="jamSelesai" value="${esc(j.jamSelesai)}"></div>
    <div class="field"><label>Tipe kelas</label><select class="input" name="tipe">${opt(['Reguler', 'Privat', 'Semiprivat'], j.tipe)}</select></div>
    <div class="field"><label>Guru/tentor</label><select class="input" name="guruId">${D('Guru').filter(g => g.status !== 'Nonaktif').map(g => `<option value="${g.id}" ${g.id === j.guruId ? 'selected' : ''}>${esc(g.nama)}</option>`).join('')}</select></div>
    <div class="field full"><label>Daftar siswa</label><div style="max-height:220px;overflow:auto;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px">
      ${siswaAktif().map(s => `<label class="row" style="gap:8px;font-weight:600;cursor:pointer"><input type="checkbox" name="sw" value="${s.id}" ${sel.includes(s.id) ? 'checked' : ''}> ${esc(s.nama)}</label>`).join('') || '<span class="muted">Belum ada siswa aktif</span>'}
    </div></div>
    <div class="field full"><label>Catatan</label><input class="input" name="catatan" value="${esc(j.catatan || '')}"></div>
  </form>`, `${id ? `<button class="btn red" style="margin-right:auto" onclick="delJadwal('${id}')">${ic('trash')} Hapus</button>` : ''}<button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn" onclick="$('#fJadwal').requestSubmit()">Simpan</button>`, true);

async function saveJadwal(id) {
  const f = formData($('#fJadwal')); delete f.sw;

  try { await saveRow('Jadwal', Object.assign(id ? { id } : {}, f)); closeModal(); toast('Jadwal tersimpan'); renderPage(); } catch (e) { toast(e.message, true); }

function delJadwal(id) { confirmBox('Hapus jadwal ini?', async () => { await removeRow('Jadwal', id); toast('Jadwal dihapus'); renderPage(); }); }

/* ================= ABSENSI SISWA ================= */
function pgAbsensi() {
  const t = S.tab.abs || 'input';
  return tabs('abs', [['input', 'Input Harian'], ['rekap', 'Rekap Bulanan']], 'input') + (t === 'input' ? absInput() : absRekap());
}
function absInput() {
  const date = S.f.absDate || todayStr(), hari = dayName(date);
  const sesi = D('Jadwal').filter(j => j.hari === hari).sort((a, b) => a.jamMulai.localeCompare(b.jamMulai));
  const js = S.f.absJadwal || 'all';
  const jad = sesi.find(j => j.id === js);
  let list = siswaAktif();
  if (jad) { const ids = jad.siswaIds.split(',').map(x => x.trim()); list = list.filter(s => ids.includes(s.id)); }
  const existing = D('Absensi').filter(a => a.tanggal === date);
  if (!S.absDraft || S.absDraft._date !== date) {
    S.absDraft = { _date: date };
    existing.forEach(a => S.absDraft[a.siswaId] = { status: a.status, catatan: a.catatan, id: a.id });
  }
  const cnt = k => list.filter(s => (S.absDraft[s.id] || {}).status === k).length;
  return `<div class="card">
    <div class="card-head">
      <div class="field"><label>Tanggal</label><input class="input" type="date" value="${date}" onchange="S.f.absJadwal='all';setF('absDate',this.value)"></div>
      <div class="field"><label>Sesi (${hari})</label><select class="input" onchange="setF('absJadwal',this.value)"><option value="all">Semua siswa aktif</option>${sesi.map(j => `<option value="${j.id}" ${js === j.id ? 'selected' : ''}>Sesi ${esc(j.sesi)} · ${esc(j.jamMulai)} · ${esc(guruById(j.guruId).nama)}</option>`).join('')}</select></div>
      <div class="field"><label>Pengajar</label><select class="input" id="absGuru">${D('Guru').map(g => `<option value="${g.id}" ${jad && jad.guruId === g.id ? 'selected' : ''}>${esc(g.nama)}</option>`).join('')}</select></div>
      <div class="spacer"></div>
      <button class="btn ghost" onclick="absAll()">✓ Semua Hadir</button>
    </div>
    <div class="row small" style="margin-bottom:6px"><span class="badge b-green">Hadir ${cnt('Hadir')}</span><span class="badge b-blue">Izin ${cnt('Izin')}</span><span class="badge b-yellow">Sakit ${cnt('Sakit')}</span><span class="badge b-red">Alpa ${cnt('Alpa')}</span><span class="muted">${existing.length ? '· sudah ada data tersimpan untuk tanggal ini' : ''}</span></div>
    <div class="table-wrap"><table class="t"><thead><tr><th>Siswa</th><th>Status</th><th>Keterangan</th></tr></thead><tbody>
      ${list.map(s => { const d = S.absDraft[s.id] || {}; return `<tr><td><b>${esc(s.nama)}</b><div class="small muted">${esc(s.id)} · Level ${esc(s.level)}</div></td>
      <td><div class="seg">${Object.entries(ST).map(([k, v]) => `<button class="${k} ${d.status === v ? 'on' : ''}" title="${v}" onclick="absSet('${s.id}','${v}')">${k}</button>`).join('')}</div></td>
      <td><input class="input" style="min-width:150px;padding:7px 10px" placeholder="opsional" value="${esc(d.catatan || '')}" onchange="absNote('${s.id}',this.value)"></td></tr>`; }).join('') || '<tr><td colspan="3"><div class="empty">Tidak ada siswa</div></td></tr>'}
    </tbody></table></div>
    <div class="row" style="margin-top:14px"><span class="small muted">H = Hadir · I = Izin · S = Sakit · A = Tanpa keterangan</span><div class="spacer"></div><button class="btn" onclick="absSave()">Simpan Absensi</button></div>
  </div>`;
}
function absSet(id, v) { S.absDraft[id] = Object.assign(S.absDraft[id] || {}, { status: v }); renderPage(); }
function absNote(id, v) { S.absDraft[id] = Object.assign(S.absDraft[id] || {}, { catatan: v }); }
function absAll() { const sesi = D('Jadwal').find(j => j.id === S.f.absJadwal); let list = siswaAktif(); if (sesi) { const ids = sesi.siswaIds.split(','); list = list.filter(s => ids.includes(s.id)); } list.forEach(s => { if (!(S.absDraft[s.id] || {}).status) absSetQuiet(s.id, 'Hadir'); }); renderPage(); }
function absSetQuiet(id, v) { S.absDraft[id] = Object.assign(S.absDraft[id] || {}, { status: v }); }
async function absSave() {
  const date = S.f.absDate || todayStr(), guruId = ($('#absGuru') || {}).value || '';
  const rows = Object.entries(S.absDraft).filter(([k, v]) => k !== '_date' && v.status).map(([sid, v]) => ({ id: v.id || '', tanggal: date, siswaId: sid, status: v.status, guruId, catatan: v.catatan || '' }));
  if (!rows.length) return toast('Belum ada status yang dipilih', true);
  rows.forEach(r => { if (!r.id) delete r.id; });
  try { const saved = await saveRows('Absensi', rows); saved.forEach(r => S.absDraft[r.siswaId].id = r.id); toast(`Absensi ${fmtDate(date)} tersimpan (${saved.length} siswa)`); renderPage(); } catch (e) { toast(e.message, true); }
}
function absRekap() {
  const p = S.f.absP || thisPeriod();
  const rows = D('Siswa').filter(s => s.status === 'Aktif' || D('Absensi').some(a => a.siswaId === s.id && a.tanggal.startsWith(p))).sort((a, b) => a.nama.localeCompare(b.nama)).map(s => ({ s, c: absMonth(s.id, p) }));
  return `<div class="card"><div class="card-head"><select class="input" style="max-width:200px" onchange="setF('absP',this.value)">${monthOptions(p)}</select><div class="spacer"></div><button class="btn ghost" onclick="csvAbs('${p}')">${ic('download')} Unduh Excel (CSV)</button></div>
  <div class="table-wrap"><table class="t"><thead><tr><th>Siswa</th><th class="c">Hadir</th><th class="c">Izin</th><th class="c">Sakit</th><th class="c">Alpa</th><th class="c">Pertemuan</th><th class="c">% Hadir</th></tr></thead><tbody>
  ${rows.map(({ s, c }) => `<tr style="cursor:pointer" onclick="absDetail('${s.id}','${p}')"><td><b>${esc(s.nama)}</b><div class="small muted">${esc(s.id)}</div></td><td class="c num cell-ok">${c.Hadir}</td><td class="c num">${c.Izin}</td><td class="c num">${c.Sakit}</td><td class="c num ${c.Alpa ? 'cell-no' : ''}">${c.Alpa}</td><td class="c num"><b>${c.total}</b></td><td class="c num">${c.total ? Math.round(c.Hadir / c.total * 100) + '%' : '-'}</td></tr>`).join('') || '<tr><td colspan="7"><div class="empty">Belum ada data</div></td></tr>'}
  </tbody></table></div></div>`;
}
function absDetail(sid, p) {
  const c = absMonth(sid, p); const s = siswaById(sid);
  modal(`${esc(s.nama)} — ${fmtPeriod(p)}`, c.rows.length ? `<table class="t"><tbody>${c.rows.sort((a, b) => a.tanggal.localeCompare(b.tanggal)).map(r => `<tr><td>${dayName(r.tanggal)}, ${fmtDate(r.tanggal)}</td><td><span class="badge ${{ Hadir: 'b-green', Izin: 'b-blue', Sakit: 'b-yellow', Alpa: 'b-red' }[r.status]}">${r.status}</span></td><td class="small muted">${esc(r.catatan || '')}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">Belum ada absensi</div>');
}
function csvAbs(p) {
  const rows = [['ID', 'Nama', 'Hadir', 'Izin', 'Sakit', 'Alpa', 'Pertemuan']];
  siswaAktif().forEach(s => { const c = absMonth(s.id, p); rows.push([s.id, s.nama, c.Hadir, c.Izin, c.Sakit, c.Alpa, c.total]); });
  downloadFile(`Rekap-Absensi-${p}.csv`, toCSV(rows));
}

/* ================= SPP ================= */
function pgSPP() {
  const t = S.tab.spp || 'tagihan';
  return `<div class="row">${tabs('spp', [['tagihan', 'Tagihan Bulanan'], ['rekap', 'Rekap Lunas / Belum'], ['riwayat', 'Riwayat Pembayaran']], 'tagihan')}<div class="spacer"></div><button class="btn" onclick="formBayar()">${ic('plus')} Catat Pembayaran</button></div>` +
    (t === 'tagihan' ? sppTagihan() : t === 'rekap' ? sppRekap() : sppRiwayat());
}
function sppTagihan() {
  const p = S.f.sppP || thisPeriod(), flt = S.f.sppFilter || 'belum';
  const billed = siswaAktif().filter(s => billedIn(s, p));
  const paid = D('SPP').filter(x => x.periode === p);
  const unpaid = billed.filter(s => !payOf(s.id, p));
  const extra = paid.filter(x => !billed.find(s => s.id === x.siswaId)).map(x => siswaById(x.siswaId));
  let rows = billed.concat(extra);
  if (flt === 'belum') rows = unpaid; else if (flt === 'lunas') rows = rows.filter(s => payOf(s.id, p));
  rows.sort((a, b) => (!!payOf(a.id, p) - !!payOf(b.id, p)) || a.nama.localeCompare(b.nama));
  const totalTag = sum(billed, s => sppNominal(s, S.settings));
  return `<div class="grid g3">
    <div class="stat bg-blue"><span class="lbl">Total tagihan ${fmtPeriod(p)}</span><span class="val num">${rp(totalTag)}</span><span class="sub">${billed.length} siswa aktif</span></div>
    <div class="stat bg-green"><span class="lbl">Sudah bayar</span><span class="val num" style="color:#0E7A41">${rp(sum(paid, x => x.nominal))}</span><span class="sub">${paid.length} siswa lunas</span></div>
    <div class="stat bg-red"><span class="lbl" style="color:#B4282D">Belum bayar</span><span class="val num" style="color:var(--red)">${rp(sum(unpaid, s => sppNominal(s, S.settings)))}</span><span class="sub">${unpaid.length} siswa · jatuh tempo ${fmtDate(dueDate(p, S.settings))}</span></div>
  </div>
  <div class="card">
    <div class="card-head">
      <select class="input" style="max-width:190px" onchange="setF('sppP',this.value)">${monthOptions(p)}</select>
      <div class="chips">${[['belum', `Belum bayar (${unpaid.length})`], ['lunas', `Lunas (${paid.length})`], ['semua', 'Semua']].map(([k, l]) => `<button class="chip ${flt === k ? 'on' : ''}" onclick="setF('sppFilter','${k}')">${l}</button>`).join('')}</div>
      <div class="spacer"></div>
      ${unpaid.length ? `<button class="btn wa" onclick="massReminder('${p}')">${ic('wa')} Kirim Pengingat (${unpaid.length})</button>` : ''}
    </div>
    <div class="table-wrap"><table class="t"><thead><tr><th>Siswa</th><th>Orang tua</th><th class="r">Nominal</th><th>Status</th><th>Pembayaran</th><th></th></tr></thead><tbody>
    ${rows.map(s => { const x = payOf(s.id, p); return `<tr class="${x ? '' : 'unpaid'}">
      <td><b>${esc(s.nama)}</b><div class="small muted">${esc(s.id)}</div></td>
      <td>${esc(s.ortu || '-')}<div class="small muted">${esc(s.waOrtu || '')}</div></td>
      <td class="r num"><b>${rp(x ? x.nominal : sppNominal(s, S.settings))}</b></td>
      <td>${x ? '<span class="badge b-green">✓ Lunas</span>' : '<span class="badge b-red">● Belum bayar</span>'}</td>
      <td class="small">${x ? `${fmtDate(x.tanggalBayar)} · ${esc(x.metode)}` : '<span class="muted">—</span>'}</td>
      <td class="nowrap r">${x
        ? `<button class="btn sm ghost" onclick="showInvoice('${s.id}','${p}')">${ic('file')} Kwitansi</button><button class="icon-btn" title="Kirim bukti WA" onclick="waInvoice('${s.id}','${p}')">${ic('wa')}</button><button class="icon-btn" title="Batalkan" onclick="delBayar('${x.id}')">${ic('trash')}</button>`
        : `<button class="btn sm green" onclick="formBayar('${s.id}','${p}')">Catat Bayar</button> <button class="btn sm ghost" onclick="showInvoice('${s.id}','${p}')">${ic('file')} Invoice</button><button class="icon-btn" title="Kirim invoice WA" onclick="waInvoice('${s.id}','${p}')">${ic('wa')}</button>`}</td>
    </tr>`; }).join('') || `<tr><td colspan="6"><div class="empty">${flt === 'belum' ? '🎉 Semua siswa sudah membayar' : 'Tidak ada data'}</div></td></tr>`}
    </tbody></table></div>
  </div>`;
}
function showInvoice(sid, p) {
  const s = siswaById(sid), x = payOf(sid, p);
  modal(x ? 'Kwitansi Pembayaran' : 'Invoice Tagihan SPP', invoiceHtml(s, p, x, S.settings),
    `<button class="btn ghost" onclick="printHtml($('#modal .inv').outerHTML,'${x ? 'Kwitansi' : 'Invoice'} ${esc(s.nama)}')">${ic('print')} Cetak / PDF</button>
     <button class="btn wa" onclick="waInvoice('${sid}','${p}')">${ic('wa')} Kirim WA</button>
     ${x ? '' : `<button class="btn green" onclick="formBayar('${sid}','${p}')">Catat Bayar</button>`}`, true);
}
function waInvoice(sid, p) { const s = siswaById(sid); openWa(s.waOrtu, invoiceWaText(s, p, payOf(sid, p), S.settings)); }
function massReminder(p) {
  const list = unpaidFor(p);
  modal(`Pengingat SPP — ${fmtPeriod(p)}`, `<p class="small muted" style="margin-bottom:10px">Klik tombol WA satu per satu untuk mengirim invoice ke orang tua. Baris yang sudah diklik akan ditandai ✓.</p>
    ${list.map(s => `<div class="li"><div class="meta"><b>${esc(s.nama)}</b><span class="small muted">${esc(s.ortu || '-')} · ${esc(s.waOrtu || 'WA belum diisi')} · ${rp(sppNominal(s, S.settings))}</span></div><button class="btn sm wa" onclick="waInvoice('${s.id}','${p}');this.textContent='✓ Terkirim';this.classList.add('ghost');this.classList.remove('wa')">${ic('wa')} Kirim</button></div>`).join('')}`);
}
function formBayar(sid, p) {
  p = p || S.f.sppP || thisPeriod();
  const s = sid ? siswaById(sid) : null;
  modal('Catat Pembayaran SPP', `<form id="fBayar" class="form-grid" onsubmit="event.preventDefault();saveBayar()">
    <div class="field full"><label>Siswa</label>${s ? `<input type="hidden" name="siswaId" value="${s.id}"><div class="input" style="background:#FAF6F9"><b>${esc(s.nama)}</b> · ${esc(s.id)}</div>` : `<select class="input" name="siswaId" required onchange="const x=siswaById(this.value);$('#fBayar [name=nominal]').value=sppNominal(x,S.settings)"><option value="">— pilih siswa —</option>${D('Siswa').filter(x => x.status !== 'Berhenti').sort((a, b) => a.nama.localeCompare(b.nama)).map(x => `<option value="${x.id}">${esc(x.nama)} (${x.id})</option>`).join('')}</select>`}</div>
    <div class="field"><label>Periode (bulan)</label><select class="input" name="periode">${monthOptions(p, 12, 3)}</select></div>
    <div class="field"><label>Nominal</label><input class="input" name="nominal" inputmode="numeric" required value="${s ? sppNominal(s, S.settings) : S.settings.nominalSPP}"></div>
    <div class="field"><label>Tanggal bayar</label><input class="input" type="date" name="tanggalBayar" required value="${todayStr()}"></div>
    <div class="field"><label>Metode</label><select class="input" name="metode"><option>Tunai</option><option>Transfer</option><option>QRIS</option></select></div>
    <div class="field full"><label>Catatan</label><input class="input" name="catatan" placeholder="opsional"></div>
  </form>`, `<button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn green" onclick="$('#fBayar').requestSubmit()">Simpan Pembayaran</button>`);

function sppRekap() {
  const y = S.f.sppY || thisPeriod().slice(0, 4), cur = thisPeriod();
  const months = Array.from({ length: 12 }, (_, i) => `${y}-${pad(i + 1)}`);
  const list = D('Siswa').filter(s => s.status === 'Aktif' || D('SPP').some(x => x.siswaId === s.id && x.periode.startsWith(y))).sort((a, b) => a.nama.localeCompare(b.nama));
  let grand = 0, grandN = 0, paidTot = 0;
  const body = list.map(s => {
    let n = 0, tot = 0;
    const cells = months.map(m => {
      const x = payOf(s.id, m);
      if (x) { paidTot += +x.nominal || 0; return `<td class="c cell-ok" title="${fmtDate(x.tanggalBayar)} · ${rp(x.nominal)}">✓</td>`; }
      if (billedIn(s, m) && m <= cur) { n++; tot += sppNominal(s, S.settings); return `<td class="c cell-no" title="Belum bayar">✗</td>`; }
      return `<td class="c cell-na">·</td>`;
    }).join('');
    grand += tot; grandN += n;
    return `<tr class="${n ? 'unpaid' : ''}"><td class="nowrap"><b>${esc(s.nama)}</b></td>${cells}<td class="c num">${n ? `<b style="color:var(--red)">${n} bln</b>` : '<span class="cell-ok">Lunas</span>'}</td><td class="r num">${n ? rp(tot) : '-'}</td></tr>`;
  }).join('');
  return `<div class="grid g3"><div class="stat bg-green"><span class="lbl">Terbayar tahun ${y}</span><span class="val num">${rp(paidTot)}</span></div>
    <div class="stat bg-red"><span class="lbl" style="color:#B4282D">Total tunggakan</span><span class="val num" style="color:var(--red)">${rp(grand)}</span><span class="sub">${grandN} bulan belum dibayar</span></div>
    <div class="stat bg-yellow"><span class="lbl">Siswa menunggak</span><span class="val num">${list.filter(s => months.some(m => billedIn(s, m) && m <= cur && !payOf(s.id, m))).length}</span><span class="sub">dari ${list.length} siswa</span></div></div>
  <div class="card"><div class="card-head"><select class="input" style="max-width:130px" onchange="setF('sppY',this.value)">${[+y - 1, +y, +y + 1].map(v => `<option ${v == y ? 'selected' : ''}>${v}</option>`).join('')}</select><span class="small muted">✓ lunas · <span style="color:var(--red)">✗ belum bayar</span> · · belum ditagih</span><div class="spacer"></div><button class="btn ghost" onclick="csvSpp('${y}')">${ic('download')} Unduh Excel (CSV)</button></div>
  <div class="table-wrap"><table class="t"><thead><tr><th>Siswa</th>${months.map(m => `<th class="c">${BULAN[+m.slice(5) - 1].slice(0, 3)}</th>`).join('')}<th class="c">Tunggakan</th><th class="r">Jumlah</th></tr></thead><tbody>${body || '<tr><td colspan="15"><div class="empty">Belum ada data</div></td></tr>'}</tbody></table></div></div>`;
}
function csvSpp(y) {
  const months = Array.from({ length: 12 }, (_, i) => `${y}-${pad(i + 1)}`), cur = thisPeriod();
  const rows = [['ID', 'Nama', ...months.map(m => fmtPeriod(m)), 'Bulan Tunggakan', 'Total Tunggakan']];
  D('Siswa').filter(s => s.status === 'Aktif').forEach(s => {
    let n = 0, t = 0;
    const c = months.map(m => { const x = payOf(s.id, m); if (x) return 'LUNAS ' + x.nominal; if (billedIn(s, m) && m <= cur) { n++; t += sppNominal(s, S.settings); return 'BELUM'; } return '-'; });
    rows.push([s.id, s.nama, ...c, n, t]);
  });
  downloadFile(`Rekap-SPP-${y}.csv`, toCSV(rows));
}

  return { level: s.level, hadir: String(c.Hadir), pertemuan: String(c.total || S.settings.pertemuanPerBulan || 8), rataNilai: n.length ? String(Math.round(sum(n, x => x.skor) / n.length)) : '', bintang: String(b) };

function jamDiff(a, b) { if (!a || !b) return ''; const [h1, m1] = a.split(':').map(Number), [h2, m2] = b.split(':').map(Number); const d = (h2 * 60 + m2 - h1 * 60 - m1) / 60; return d > 0 ? String(Math.round(d * 2) / 2) : ''; }
function guruHadir() {

    <td><input class="input" id="jm_${g.id}" inputmode="decimal" style="padding:7px 9px;width:80px" value="${esc(d.jamMengajar || '')}" onchange="gSet('${g.id}','jamMengajar',this.value)"></td>
    <td><input class="input" style="padding:7px 9px;min-width:120px" value="${esc(d.catatan || '')}" onchange="gSet('${g.id}','catatan',this.value)"></td></tr>`; }).join('')}

function gSet(id, k, v, re) {
  const d = S.gDraft[id] = Object.assign(S.gDraft[id] || {}, { [k]: v });

  if (k === 'jamMasuk' || k === 'jamKeluar') { const j = jamDiff(d.jamMasuk, d.jamKeluar); if (j) { d.jamMengajar = j; const el = $('#jm_' + id); if (el) el.value = j; } }
  if (re) renderPage();
}
async function gSave() {
  const date = S.f.gDate || todayStr();

let Q = null;

  renderQuiz();
  clearInterval(Q.timer); Q.timer = setInterval(() => { const el = $('#qTimer'); if (el) el.textContent = fmtSec((Date.now() - Q.t0) / 1000); else clearInterval(Q.timer); }, 1000);
}
const fmtSec = s => `${Math.floor(s / 60)}:${pad(Math.floor(s % 60))}`;
function renderQuiz(state = '') {
  const it = Q.items[Q.i], L = LEVELS[Q.level - 1];
  $('#app').innerHTML = kidTop(L.judul) + `<div class="kid-wrap"><div class="quiz">
    <div class="row"><button class="btn sm ghost" onclick="quitQuiz()">✕ Keluar</button><div class="spacer"></div><b>Soal ${Q.i + 1}/${Q.items.length}</b><div class="spacer"></div><span class="badge b-pink" style="font-size:14px">⏱ <span id="qTimer">${fmtSec((Date.now() - Q.t0) / 1000)}</span></span></div>
    <div class="dots">${Q.items.map((_, k) => `<i class="${k < Q.res.length ? (Q.res[k] ? 'ok' : 'no') : k === Q.i ? 'cur' : ''}"></i>`).join('')}</div>
    <div class="q-box ${state}" id="qBox"><div class="q-text">${esc(it.q)} = ?</div><div class="q-ans" id="qAns">${esc(Q.ans) || '&nbsp;'}</div>
      ${state === 'wrong' ? `<div style="margin-top:8px;font-weight:800;color:var(--red)">Jawaban yang benar: ${esc(it.ans)}</div>` : state === 'right' ? '<div style="margin-top:8px;font-weight:800;color:var(--green)">Hebat! Benar 🎉</div>' : ''}</div>
    <div class="keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button onclick="qKey('${n}')">${n}</button>`).join('')}<button class="del" onclick="qKey('del')">⌫</button><button onclick="qKey('0')">0</button><button class="ok" onclick="qKey('ok')">✓</button></div>
  </div></div>`;
}
function qKey(k) {
  if (!Q || Q.lock) return;
  if (k === 'del') Q.ans = Q.ans.slice(0, -1);
  else if (k === 'ok') return qSubmit();
  else if (Q.ans.length < 5) Q.ans += k;
  const el = $('#qAns'); if (el) el.innerHTML = esc(Q.ans) || '&nbsp;';
}
function qSubmit() {
  if (!Q.ans) return;
  const ok = Q.ans.replace(/^0+(?=\d)/, '') === String(Q.items[Q.i].ans);
  Q.res.push(ok); Q.lock = true;
  renderQuiz(ok ? 'right' : 'wrong');
  setTimeout(() => { Q.lock = false; Q.i++; Q.ans = ''; Q.i >= Q.items.length ? finishQuiz() : renderQuiz(); }, ok ? 700 : 1600);
}
document.addEventListener('keydown', e => {
  if (!Q || S.role !== 'murid' || !$('.keypad')) return;
  if (/^\d$/.test(e.key)) qKey(e.key); else if (e.key === 'Backspace') qKey('del'); else if (e.key === 'Enter') qKey('ok');
});
function quitQuiz() { confirmBox('Keluar dari latihan? Hasil tidak akan disimpan.', () => { clearInterval(Q.timer); Q = null; renderMurid(); }, 'Ya, keluar'); }
async function finishQuiz() {
  clearInterval(Q.timer);
  const benar = Q.res.filter(Boolean).length, total = Q.items.length, durasi = Math.round((Date.now() - Q.t0) / 1000);
  let r;
  try { r = (await call('submitQuiz', { level: Q.level, benar, total, durasi })).result; }
  catch (e) { toast(e.message, true); r = { skor: Math.round(benar / total * 100), bintang: 0, gagal: true }; }
  try { const m = await call('me', {}, { silent: true }); S.me = m.data; } catch (e) {}
  const msg = r.skor === 100 ? 'Sempurna! Kamu jago banget! 🏆' : r.skor >= 75 ? 'Keren! Terus berlatih ya! 🎉' : r.skor >= 60 ? 'Bagus! Sedikit lagi jadi juara 💪' : 'Tidak apa-apa, ayo coba lagi! 🌈';
  const lv = Q.level; Q = null;
  $('#app').innerHTML = kidTop('Hasil latihan') + `<div class="kid-wrap"><div class="quiz result">
    <h2 style="font-size:24px">Latihan selesai!</h2>
    <div class="stars">${[0, 1, 2].map(i => `<span class="${i < r.bintang ? '' : 'off'}" style="animation-delay:${.15 + i * .2}s">⭐</span>`).join('')}</div>
    <div class="score-big num">${r.skor}</div>
    <p style="font-weight:800">${benar} dari ${total} benar · waktu ${fmtSec(durasi)}</p>
    <p style="font-size:18px;margin:8px 0 6px">${msg}</p>
    ${r.bintang ? `<p class="badge b-yellow" style="font-size:14px">+${r.bintang} bintang masuk ke tabunganmu!</p>` : '<p class="small muted">Dapatkan skor 60 ke atas untuk mendapat bintang.</p>'}
    ${r.gagal ? '<p class="small" style="color:var(--red)">Hasil belum tersimpan (koneksi). Coba lagi nanti.</p>' : ''}
    <div class="row" style="justify-content:center;margin-top:16px"><button class="btn ghost" onclick="renderMurid()">Kembali</button><button class="btn" onclick="startQuiz(${lv})">Ulangi Level ${lv}</button></div>
  </div></div>`;
}

/* =========================================================
   PORTAL ORANG TUA
   ========================================================= */
function renderOrtu() {
  const s = S.me.siswa, st = S.settings, p = thisPeriod();
  const t = S.tab.ortu || 'ringkas';
  const periods = billablePeriods(s, p, 12);
  const pay = per => S.me.SPP.find(x => x.periode === per);
  const unpaid = s.status === 'Aktif' ? periods.filter(per => !pay(per)) : [];
  const ab = S.me.Absensi.filter(a => a.tanggal.startsWith(p));
  const stars = sum(S.me.Bintang, b => b.jumlah);
  const laps = [...S.me.Laporan].sort((a, b) => b.periode.localeCompare(a.periode));
  const L = LEVELS[(+s.level || 1) - 1];
  let body = '';
  if (t === 'ringkas') {
    body = `${unpaid.length ? `<div class="card" style="background:var(--red-50);border-color:#F8CACA"><div class="row"><div style="font-size:30px">⚠️</div><div style="flex:1;min-width:200px"><h3 style="color:#B4282D;margin:0">Ada tagihan SPP belum dibayar</h3><p class="small">${unpaid.map(fmtPeriod).join(', ')} · total <b>${rp(unpaid.length * sppNominal(s, st))}</b></p></div><button class="btn red" onclick="S.tab.ortu='spp';renderOrtu()">Lihat Invoice</button></div></div>`
      : `<div class="card" style="background:var(--green-50);border-color:#BFEBD2"><div class="row"><div style="font-size:30px">✅</div><div><h3 style="color:#0E7A41;margin:0">SPP ${fmtPeriod(p)} sudah lunas</h3><p class="small">Terima kasih atas pembayarannya 🙏</p></div></div></div>`}
    <div class="grid g4">
      <div class="stat bg-blue"><span class="lbl">Hadir ${BULAN[+p.slice(5) - 1]}</span><span class="val num">${ab.filter(a => a.status === 'Hadir').length}/${ab.length}</span><span class="sub">pertemuan</span></div>
      <div class="stat" style="background:${L.bg}"><span class="lbl">Level</span><span class="val num">${esc(s.level)}</span><span class="sub">${L.desc}</span></div>
      <div class="stat bg-yellow"><span class="lbl">Tabungan bintang</span><span class="val num">⭐ ${stars}</span><span class="sub">bisa ditukar hadiah</span></div>
      <div class="stat bg-green"><span class="lbl">Latihan</span><span class="val num">${S.me.Nilai.length}</span><span class="sub">rata-rata ${S.me.Nilai.length ? Math.round(sum(S.me.Nilai, n => n.skor) / S.me.Nilai.length) : '-'}</span></div>
    </div>
    <div class="grid g2">
      <div class="card"><h3>Laporan terbaru</h3>${laps[0] ? `<div class="li"><div class="avatar" style="background:var(--blue-50)">📄</div><div class="meta"><b>${fmtPeriod(laps[0].periode)}</b><span class="small muted">${esc((laps[0].catatanGuru || '').slice(0, 80))}…</span></div><button class="btn sm" onclick="ortuLap('${laps[0].id}')">Lihat</button></div>` : '<div class="empty">Laporan bulan ini belum tersedia</div>'}</div>
      <div class="card"><h3>Jadwal les</h3>${S.me.Jadwal.map(j => `<div class="li"><div class="avatar" style="background:var(--green-50)">${esc(j.hari.slice(0, 2))}</div><div class="meta"><b>${esc(j.hari)}, ${esc(j.jamMulai)}–${esc(j.jamSelesai)}</b><span class="small muted">${esc(j.tipe)} · ${esc(j.guruNama)}</span></div></div>`).join('') || '<div class="empty">Belum ada jadwal</div>'}</div>
    </div>`;
  } else if (t === 'spp') {
    const all = [...new Set(periods.concat(S.me.SPP.map(x => x.periode)))].sort().reverse();
    body = `<div class="card"><div class="card-head"><h3>Status SPP</h3><div class="spacer"></div><span class="small muted">Nominal ${rp(sppNominal(s, st))}/bulan · jatuh tempo tgl ${esc(st.jatuhTempo)}</span></div>
      <table class="t"><thead><tr><th>Periode</th><th>Status</th><th class="r"></th></tr></thead><tbody>
      ${all.map(per => { const x = pay(per); return `<tr class="${x ? '' : 'unpaid'}"><td><b>${fmtPeriod(per)}</b><div class="small muted">${x ? `Dibayar ${fmtDate(x.tanggalBayar)} · ${esc(x.metode)}` : `Jatuh tempo ${fmtDate(dueDate(per, st))}`}</div></td><td>${x ? '<span class="badge b-green">✓ Lunas</span>' : '<span class="badge b-red">● Belum bayar</span>'}</td><td class="r"><button class="btn sm ${x ? 'ghost' : ''}" onclick="ortuInv('${per}')">${x ? 'Kwitansi' : 'Invoice'}</button></td></tr>`; }).join('') || '<tr><td colspan="3"><div class="empty">Belum ada tagihan</div></td></tr>'}
      </tbody></table>
      <div style="margin-top:14px;background:var(--yellow-50);border-radius:14px;padding:12px 14px" class="small"><b>Cara bayar:</b> transfer ke ${esc(st.rekening || '-')}, lalu kirim bukti ke admin.<div style="margin-top:8px"><button class="btn sm wa" onclick="openWa('${esc(st.noWa)}','Assalamu\\'alaikum admin, saya orang tua ${esc(s.nama)} (${esc(s.id)}) ingin konfirmasi pembayaran SPP. Berikut bukti transfernya:')">${ic('wa')} Konfirmasi ke Admin</button></div></div></div>`;
  } else if (t === 'absen') {
    const per = S.f.oP || p; const rows = S.me.Absensi.filter(a => a.tanggal.startsWith(per)).sort((a, b) => b.tanggal.localeCompare(a.tanggal));
    const c = k => rows.filter(r => r.status === k).length;
    body = `<div class="card"><div class="card-head"><select class="input" style="max-width:200px" onchange="S.f.oP=this.value;renderOrtu()">${monthOptions(per, 12, 0)}</select></div>
      <div class="row" style="margin-bottom:10px"><span class="badge b-green">Hadir ${c('Hadir')}</span><span class="badge b-blue">Izin ${c('Izin')}</span><span class="badge b-yellow">Sakit ${c('Sakit')}</span><span class="badge b-red">Alpa ${c('Alpa')}</span></div>
      ${rows.map(r => `<div class="li"><div class="meta"><b>${dayName(r.tanggal)}, ${fmtDateLong(r.tanggal)}</b>${r.catatan ? `<span class="small muted">${esc(r.catatan)}</span>` : ''}</div><span class="badge ${{ Hadir: 'b-green', Izin: 'b-blue', Sakit: 'b-yellow', Alpa: 'b-red' }[r.status]}">${r.status}</span></div>`).join('') || '<div class="empty">Belum ada absensi di bulan ini</div>'}</div>`;
  } else if (t === 'lap') {
    body = `<div class="card"><h3>Laporan bulanan</h3>${laps.map(l => `<div class="li"><div class="avatar" style="background:var(--blue-50)">📄</div><div class="meta"><b>${fmtPeriod(l.periode)}</b><span class="small muted">Hadir ${esc(l.hadir)}/${esc(l.pertemuan)} · nilai ${esc(l.rataNilai || '-')} · ⭐ ${esc(l.bintang)}</span></div><button class="btn sm" onclick="ortuLap('${l.id}')">Lihat / Cetak</button></div>`).join('') || '<div class="empty">Belum ada laporan</div>'}</div>`;
  } else {
    const nilai = [...S.me.Nilai].sort((a, b) => b.tanggal.localeCompare(a.tanggal));
    const bin = [...S.me.Bintang].sort((a, b) => b.tanggal.localeCompare(a.tanggal));
    body = `<div class="grid g2"><div class="card"><h3>Hasil latihan soal</h3>${nilai.slice(0, 20).map(n => `<div class="li"><div class="avatar" style="background:${LEVELS[n.level - 1].bg}">L${esc(n.level)}</div><div class="meta"><b>Skor ${esc(n.skor)} (${esc(n.benar)}/${esc(n.total)})</b><span class="small muted">${fmtDate(n.tanggal)}</span></div><span>${'⭐'.repeat(+n.bintang) || '—'}</span></div>`).join('') || '<div class="empty">Belum ada latihan</div>'}</div>
      <div class="card"><h3>Riwayat bintang</h3>${bin.slice(0, 20).map(b => `<div class="li"><div class="meta"><b>${esc(b.keterangan)}</b><span class="small muted">${fmtDate(b.tanggal)}</span></div><b class="num">${+b.jumlah > 0 ? '+' : ''}${esc(b.jumlah)}</b></div>`).join('') || '<div class="empty">Belum ada</div>'}</div></div>`;
  }
  $('#app').innerHTML = kidTop('Portal Orang Tua') + `<div class="kid-wrap">
    <div class="hero"><div class="avatar" style="width:64px;height:64px;font-size:24px;position:relative;z-index:1">${initials(s.nama)}</div><div style="position:relative;z-index:1;min-width:0"><h2>${esc(s.nama)}</h2><p>${esc(s.id)} · ${esc(L.judul)} · ${stBadge(s.status)}</p></div></div>
    <div class="row"><div class="tabs">${[['ringkas', 'Ringkasan'], ['spp', `SPP${unpaid.length ? ' 🔴' : ''}`], ['absen', 'Kehadiran'], ['lap', 'Laporan'], ['latihan', 'Latihan & Bintang']].map(([k, l]) => `<button class="${t === k ? 'on' : ''}" onclick="S.tab.ortu='${k}';renderOrtu()">${l}</button>`).join('')}</div></div>
    ${body}
  </div>`;
}
function ortuInv(per) {
  const s = S.me.siswa, x = S.me.SPP.find(v => v.periode === per);
  modal(x ? 'Kwitansi Pembayaran' : 'Invoice SPP', invoiceHtml(s, per, x, S.settings), `<button class="btn ghost" onclick="printHtml($('#modal .inv').outerHTML,'SPP ${fmtPeriod(per)}')">${ic('print')} Cetak / Simpan PDF</button>${x ? '' : `<button class="btn wa" onclick="openWa('${esc(S.settings.noWa)}','Assalamu\\'alaikum admin, saya orang tua ${esc(s.nama)} (${esc(s.id)}) ingin konfirmasi pembayaran SPP ${fmtPeriod(per)}. Berikut bukti transfernya:')">${ic('wa')} Kirim Bukti Bayar</button>`}`, true);
}
function ortuLap(id) {
  const l = S.me.Laporan.find(x => x.id === id), s = S.me.siswa;
  modal('Laporan Bulanan', laporanHtml(s, l, S.settings, S.me.Absensi.filter(a => a.tanggal.startsWith(l.periode))), `<button class="btn" onclick="printHtml($('#modal .inv').outerHTML,'Laporan ${esc(s.nama)}')">${ic('print')} Cetak / Simpan PDF</button>`, true);
}

init();

</script>
</body>
</html>
