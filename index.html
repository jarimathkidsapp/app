<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>JariMath Kids — Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#E31183; --pink-d:#B80D69; --pink-50:#FDE8F3; --pink-100:#FBD3E8;
  --yellow:#FFC928; --yellow-d:#B98A00; --yellow-50:#FFF6D9;
  --green:#18A058; --green-50:#DDF7E8;
  --blue:#2F7BEA; --blue-50:#DFEBFF;
  --purple:#7A4BD8; --purple-50:#EEE6FF;
  --orange:#FF8A3D; --orange-50:#FFEBDD;
  --red:#E5484D; --red-50:#FDECEC;
  --ink:#2D2A4A; --ink-2:#5A5775; --muted:#8E8BA6; --line:#F0E3EC;
  --bg:#FFF7FB; --card:#FFFFFF;
  --r:18px; --r-sm:12px;
  --shadow:0 2px 0 rgba(45,42,74,.04), 0 8px 24px -12px rgba(227,17,131,.18);
  --font-h:'Fredoka', 'Nunito', system-ui, sans-serif;
  --font-b:'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
h1,h2,h3,h4{font-family:var(--font-h);font-weight:600;line-height:1.2;letter-spacing:.1px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--pink);text-decoration:none}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.nowrap{white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}}
@media(max-width:560px){.g2.keep{grid-template-columns:repeat(2,minmax(0,1fr))}.g2:not(.keep){grid-template-columns:1fr}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:999px;font-weight:800;font-size:14px;background:var(--pink);color:#fff;box-shadow:0 3px 0 var(--pink-d);transition:transform .08s, filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--pink-d)}
.btn svg{width:17px;height:17px}
.btn.sm{padding:6px 12px;font-size:13px;box-shadow:0 2px 0 var(--pink-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line),0 2px 0 var(--line)}
.btn.yellow{background:var(--yellow);color:var(--ink);box-shadow:0 3px 0 var(--yellow-d)}
.btn.green{background:var(--green);box-shadow:0 3px 0 #0E7A41}
.btn.wa{background:#25D366;box-shadow:0 3px 0 #179C4A}
.btn.red{background:var(--red);box-shadow:0 3px 0 #B4282D}
.btn.block{width:100%}
.btn:disabled{opacity:.55;pointer-events:none}
.icon-btn{width:36px;height:36px;border-radius:12px;display:inline-grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{background:var(--pink-50);color:var(--pink)}
.icon-btn svg{width:20px;height:20px}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:800;color:var(--ink-2)}
.input,select.input,textarea.input{width:100%;padding:10px 13px;border-radius:12px;border:1.5px solid var(--line);background:#fff;outline:none;transition:border-color .15s, box-shadow .15s}
.input:focus{border-color:var(--pink);box-shadow:0 0 0 4px var(--pink-50)}
textarea.input{min-height:84px;resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
@media(max-width:560px){.form-grid{grid-template-columns:1fr}}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid #F8EAF2;padding:18px}
.card h3{font-size:18px;margin-bottom:10px}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-head h3{margin:0}
.stat{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .lbl{font-size:13px;font-weight:700;color:var(--ink-2)}
.stat .val{font-family:var(--font-h);font-size:26px;font-weight:600;line-height:1.1}
.stat .sub{font-size:12px;color:var(--ink-2)}
.bg-pink{background:var(--pink-50)} .bg-yellow{background:var(--yellow-50)} .bg-green{background:var(--green-50)} .bg-blue{background:var(--blue-50)} .bg-purple{background:var(--purple-50)} .bg-orange{background:var(--orange-50)} .bg-red{background:var(--red-50)}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.b-green{background:var(--green-50);color:#0E7A41}
.b-red{background:var(--red-50);color:#B4282D}
.b-yellow{background:var(--yellow-50);color:#8A6500}
.b-blue{background:var(--blue-50);color:#1D5DBF}
.b-pink{background:var(--pink-50);color:var(--pink-d)}
.b-purple{background:var(--purple-50);color:#5B32B0}
.b-gray{background:#F1EFF5;color:var(--ink-2)}

/* ---------- table ---------- */
.table-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:800;padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tr.unpaid td{background:#FFF4F4}
.t tr.unpaid td:first-child{box-shadow:inset 4px 0 0 var(--red)}
.t .c{text-align:center}
.t .r{text-align:right}

/* ---------- tabs / chips ---------- */
.tabs{display:flex;gap:6px;background:#fff;padding:5px;border-radius:999px;box-shadow:var(--shadow);overflow-x:auto;max-width:100%;scrollbar-width:none}
.tabs button{padding:8px 16px;border-radius:999px;font-weight:800;font-size:14px;color:var(--ink-2);white-space:nowrap}
.tabs button.on{background:var(--pink);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 13px;border-radius:999px;font-weight:800;font-size:13px;background:#fff;border:1.5px solid var(--line);color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:
  radial-gradient(circle at 12% 18%, var(--yellow-50) 0 120px, transparent 121px),
  radial-gradient(circle at 88% 82%, var(--blue-50) 0 160px, transparent 161px),
  radial-gradient(circle at 90% 10%, var(--pink-100) 0 90px, transparent 91px), var(--bg)}
.login-card{width:100%;max-width:410px;background:#fff;border-radius:28px;padding:28px 24px;box-shadow:0 20px 50px -24px rgba(227,17,131,.45);text-align:center}
.login-card .logo{width:132px;height:132px;margin:-4px auto 8px;display:block}
.login-card h1{font-size:24px}
.login-card .tabs{margin:18px 0 16px;justify-content:center}
.login-card .tabs button{flex:1}
.login-card form{display:flex;flex-direction:column;gap:12px;text-align:left}
.login-hint{font-size:13px;color:var(--muted);text-align:center;margin-top:12px}
.demo-box{margin-top:16px;background:var(--yellow-50);border-radius:14px;padding:10px 12px;font-size:12.5px;text-align:left;color:#6B5200}
.demo-box b{color:var(--ink)}

/* ---------- app shell ---------- */
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px}
.brand img{width:46px;height:46px}
.brand b{font-family:var(--font-h);font-size:18px;display:block;line-height:1.1;color:var(--pink)}
.brand span{font-size:12px;color:var(--muted)}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:14px;font-weight:700;color:var(--ink-2);text-align:left;width:100%}
.nav-item svg{width:20px;height:20px;flex-shrink:0}
.nav-item:hover{background:var(--pink-50);color:var(--pink)}
.nav-item.on{background:var(--pink);color:#fff}
.nav-item .cnt{margin-left:auto;background:var(--red);color:#fff;font-size:11px;padding:1px 7px;border-radius:999px}
.nav-item.on .cnt{background:#fff;color:var(--red)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 26px;position:sticky;top:0;z-index:20;background:rgba(255,247,251,.9);backdrop-filter:blur(8px)}
.topbar h2{font-size:22px}
.topbar .menu-btn,.topbar .home-btn,.mobile-only{display:none!important}
.content{padding:6px 26px 40px;display:flex;flex-direction:column;gap:16px;max-width:1240px;width:100%}
.user-pill{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:5px 6px 5px 14px;box-shadow:var(--shadow);font-weight:700;font-size:13px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-family:var(--font-h);font-weight:700;color:var(--ink);font-size:14px;flex-shrink:0}
.mode-flag{position:fixed;bottom:12px;right:12px;pointer-events:none;z-index:80;background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;opacity:.9}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:60;transform:translateX(-105%);transition:transform .22s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(45,42,74,.35);z-index:55}
  .topbar{padding:12px 16px}
  .topbar .menu-btn,.topbar .home-btn{display:inline-grid!important}
  .nav-item.mobile-only{display:flex!important}
  .topbar h2{font-size:19px}
  .user-pill .nm{display:none}
  .content{padding:4px 16px 40px}
}

/* ---------- home hero + tiles (seperti brief) ---------- */
.hero{background:var(--pink-50);border-radius:22px;padding:20px;display:flex;gap:16px;align-items:center;position:relative;overflow:hidden}
.hero img{width:84px;height:84px;flex-shrink:0}
.hero h2{color:var(--pink-d);font-size:23px}
.hero p{color:var(--pink-d);opacity:.85}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:var(--pink-100);opacity:.6}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{border-radius:18px;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:800;color:var(--ink);text-align:center;transition:transform .12s}
.tile:hover{transform:translateY(-2px)}
.tile svg{width:30px;height:30px;color:var(--pink-d)}
@media(max-width:560px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.tile{padding:13px 6px;font-size:12.5px;line-height:1.25}.tile svg{width:25px;height:25px}.hero{padding:16px;gap:12px}.hero img{width:56px;height:56px}.hero h2{font-size:19px}.hero p{font-size:13.5px}}
.tiles.desktop-hide{display:none}
@media(max-width:900px){.tiles.desktop-hide{display:grid}}

/* list items */
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .meta{min-width:0;flex:1}
.li .meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:26px 10px;text-align:center;color:var(--muted);font-weight:600}

/* status segmented (absensi) */
.seg{display:inline-flex;background:#F6F1F5;border-radius:12px;padding:3px;gap:2px}
.seg button{min-width:38px;padding:6px 9px;border-radius:9px;font-weight:800;font-size:13px;color:var(--ink-2)}
.seg button.on.H{background:var(--green);color:#fff}
.seg button.on.I{background:var(--blue);color:#fff}
.seg button.on.S{background:var(--orange);color:#fff}
.seg button.on.A{background:var(--red);color:#fff}

/* jadwal */
.days{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media(max-width:900px){.days{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.days{grid-template-columns:1fr}}
.day{border-radius:18px;padding:14px;background:#fff;box-shadow:var(--shadow)}
.day h4{font-size:16px;padding:6px 12px;border-radius:12px;margin-bottom:10px;display:flex;align-items:center}
.sess{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.sess:hover{border-color:var(--pink-100)}
.sess .time{font-weight:800;font-size:13px}

/* rekap grid */
.cell-ok{color:#0E7A41;font-weight:800}
.cell-no{color:#B4282D;font-weight:800;background:var(--red-50)}
.cell-na{color:#C9C5D6}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(45,42,74,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow-y:auto}
.modal{background:#fff;border-radius:22px;width:100%;max-width:560px;box-shadow:0 30px 60px -20px rgba(0,0,0,.35);animation:pop .18s ease-out}
.modal.wide{max-width:760px}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:19px;flex:1}
.modal-b{padding:18px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-weight:700;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.toast.err{background:var(--red)}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:rgba(255,247,251,.6);z-index:150}
.spin{width:44px;height:44px;border-radius:50%;border:5px solid var(--pink-100);border-top-color:var(--pink);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* invoice preview */
.inv{font-family:var(--font-b);color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:22px;position:relative;overflow:hidden}
.inv-h{display:flex;gap:12px;align-items:center;border-bottom:2px dashed var(--pink-100);padding-bottom:14px;margin-bottom:14px}
.inv-h img{width:64px;height:64px}
.inv-h h2{font-size:20px;color:var(--pink)}
.inv table{width:100%;border-collapse:collapse;font-size:14px}
.inv td{padding:6px 0;vertical-align:top}
.inv .tot{font-family:var(--font-h);font-size:24px;color:var(--pink)}
.stamp{position:absolute;right:18px;top:92px;transform:rotate(-12deg);border:3px solid;border-radius:10px;padding:4px 12px;font-family:var(--font-h);font-weight:700;font-size:20px;letter-spacing:1px;opacity:.85}
.stamp.paid{color:var(--green);border-color:var(--green)}
.stamp.unpaid{color:var(--red);border-color:var(--red)}

/* ---------- murid ---------- */
.kid-top{display:flex;align-items:center;gap:10px;padding:14px 16px;max-width:880px;margin:0 auto;width:100%}
.kid-top img{width:48px;height:48px}
.kid-wrap{max-width:880px;margin:0 auto;padding:0 16px 40px;display:flex;flex-direction:column;gap:16px;width:100%}
.star-pill{display:inline-flex;align-items:center;gap:6px;background:var(--yellow);border-radius:999px;padding:6px 14px;font-family:var(--font-h);font-weight:700;font-size:18px;box-shadow:0 3px 0 var(--yellow-d)}
.kid-hero{border-radius:26px;padding:22px;background:linear-gradient(135deg,var(--pink) 0%,#F0479F 100%);color:#fff;display:flex;gap:16px;align-items:center;position:relative;overflow:hidden}
.kid-hero h2{font-size:26px}
.kid-hero .lv{display:inline-block;margin-top:8px;background:rgba(255,255,255,.22);padding:4px 12px;border-radius:999px;font-weight:800;font-size:13px}
.kid-hero .big-emoji{font-size:60px;line-height:1}
.levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:560px){.levels{grid-template-columns:1fr}}
.level-card{border-radius:22px;padding:18px;text-align:left;display:flex;gap:14px;align-items:center;transition:transform .12s;position:relative;border:2.5px solid transparent}
.level-card:hover{transform:translateY(-2px)}
.level-card .n{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font-family:var(--font-h);font-size:30px;font-weight:700;color:#fff;flex-shrink:0;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.level-card h3{font-size:18px}
.level-card p{font-size:13px;color:var(--ink-2)}
.level-card.locked{opacity:.55;filter:grayscale(.6);cursor:not-allowed}
.level-card .lock{position:absolute;right:14px;top:12px;font-size:18px}
.quiz{background:#fff;border-radius:26px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;max-width:460px;margin:0 auto;width:100%}
.dots{display:flex;gap:5px}
.dots i{flex:1;height:8px;border-radius:9px;background:#F1E8EE}
.dots i.ok{background:var(--green)} .dots i.no{background:var(--red)} .dots i.cur{background:var(--yellow)}
.q-box{text-align:center;padding:18px 8px;border-radius:20px;background:var(--yellow-50)}
.q-text{font-family:var(--font-h);font-size:46px;font-weight:700;color:var(--ink);letter-spacing:1px}
.q-ans{margin-top:8px;font-family:var(--font-h);font-size:38px;font-weight:700;min-height:52px;color:var(--pink);background:#fff;border-radius:14px;border:2.5px dashed var(--pink-100);padding:2px 10px}
.q-box.right{background:var(--green-50)} .q-box.wrong{background:var(--red-50);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.keypad button{height:58px;border-radius:16px;background:#fff;border:2px solid var(--line);font-family:var(--font-h);font-size:26px;font-weight:600;box-shadow:0 3px 0 var(--line)}
.keypad button:active{transform:translateY(2px);box-shadow:none}
.keypad .ok{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 3px 0 #0E7A41}
.keypad .del{background:var(--pink-50);color:var(--pink-d)}
.result{text-align:center;padding:10px}
.result .stars{font-size:54px;letter-spacing:6px;margin:6px 0}
.result .stars span{display:inline-block;animation:starpop .5s both}
.result .stars span.off{filter:grayscale(1);opacity:.25}
@keyframes starpop{from{transform:scale(0) rotate(-60deg)}70%{transform:scale(1.3)}}
.score-big{font-family:var(--font-h);font-size:64px;color:var(--pink);font-weight:700;line-height:1}


/* ---------- tema warna per portal (mengikuti contoh desain) ---------- */
body.role-admin{--pink:#8E2A7E;--pink-d:#6B1E5F;--pink-50:#F7EAF4;--pink-100:#EBCDE4}
body.role-ortu{--pink:#159A6B;--pink-d:#0E774F;--pink-50:#E3F6EE;--pink-100:#C4EADA}
body.role-admin .side,body.role-guru .side,body.role-ortu .side{background:linear-gradient(180deg,#fff 0%,var(--pink-50) 140%)}
.brand .role-tag,.role-tag{color:#fff!important;display:inline-flex;align-items:center;gap:6px;background:var(--pink);color:#fff;font-weight:800;font-size:12px;padding:3px 10px;border-radius:8px;margin-top:3px}
/* login dua kolom */
.login-card.split{max-width:880px;display:grid;grid-template-columns:1fr 1.05fr;padding:0;overflow:hidden;text-align:left;border:1px solid var(--pink-100)}
.login-side{background:var(--pink-50);padding:30px 28px;display:flex;flex-direction:column;gap:10px;justify-content:center;position:relative;overflow:hidden}
.login-side .brand-row{display:flex;align-items:center;gap:12px}
.login-side .brand-row img{width:64px;height:64px}
.login-side .brand-row b{font-family:var(--font-h);font-size:22px;color:var(--pink);display:block;line-height:1.1}
.login-side .illus{font-size:96px;line-height:1.05;margin:14px 0 6px;text-align:center}
.login-side p{color:var(--pink-d);font-weight:700}
.login-side:after{content:"";position:absolute;right:-50px;bottom:-50px;width:170px;height:170px;border-radius:50%;background:var(--pink-100);opacity:.55}
.login-main{padding:28px 30px}
.login-main h2{font-size:22px;margin-top:16px}
.login-main .tabs{margin:0;justify-content:stretch}
.login-main .tabs button{flex:1}
.login-main form{display:flex;flex-direction:column;gap:12px;margin-top:14px}
@media(max-width:720px){.login-card.split{grid-template-columns:1fr}.login-side{padding:20px;align-items:center;text-align:center}.login-side .illus{font-size:64px;margin:6px 0 0}.login-main{padding:22px 20px}}
/* kartu angka dengan ikon */
.kpi{background:#fff;border-radius:var(--r);border:1px solid #F1E4EC;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;margin-bottom:8px}
.kpi .ico svg{width:22px;height:22px}
.kpi .lbl{font-size:13px;font-weight:700;color:var(--ink-2)}
.kpi .val{font-family:var(--font-h);font-size:26px;font-weight:600;line-height:1.15}
.kpi .sub{font-size:12px;color:var(--muted)}
.kpi.alert{border-color:#F6C8CA;background:#FFF8F8}
.welcome{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.welcome h2{font-size:23px;color:var(--pink-d)}
.date-chip{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:800;font-size:13px;white-space:nowrap}
.task{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-weight:600}
.task:last-child{border-bottom:0}
.task .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--pink-100);display:grid;place-items:center;flex-shrink:0;font-size:13px;color:#fff}
.task.done .box{background:var(--green);border-color:var(--green)}
.task.done span{color:var(--muted);text-decoration:line-through}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.g-chart{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media(max-width:900px){.g-chart{grid-template-columns:1fr}}
.donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}

/* print */
@media print{
  body *{visibility:hidden}
  .print-area,.print-area *{visibility:visible}
  .print-area{position:absolute;left:0;top:0;width:100%}
}

const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
const DEMO = !IS_GAS && !CONFIG.API_URL;

const S = { token: null, role: null, profile: null, db: {}, settings: {}, me: null, page: null, tab: {}, f: {} };

/* ---------------- storage aman ---------------- */
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/* ---------------- API ---------------- */
async function call(action, payload = {}, opts = {}) {
  const req = Object.assign({ action, token: S.token }, payload);
  if (!opts.silent) loading(true);
  try {
    let res;
    if (IS_GAS) {
      res = await new Promise((ok, ko) => google.script.run.withSuccessHandler(r => ok(JSON.parse(r))).withFailureHandler(ko).api(JSON.stringify(req)));
    } else if (DEMO) {
      await new Promise(r => setTimeout(r, 120));
      res = Mock.handle(JSON.parse(JSON.stringify(req)));
    } else {
      const r = await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify(req) });
      res = await r.json();
    }
    if (!res.ok) {
      if (res.error === 'SESSION') { logout(true); }
      throw new Error(res.message || res.error || 'Terjadi kesalahan');
    }
    return res;
  } finally { if (!opts.silent) loading(false); }
}

/* ---------------- helpers ---------------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rp = n => 'Rp' + (Number(n) || 0).toLocaleString('id-ID');
const pad = n => String(n).padStart(2, '0');
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const thisPeriod = () => todayStr().slice(0, 7);
const fmtDate = s => { if (!s) return '-'; const [y, m, d] = String(s).split('-'); return d ? `${+d} ${BULAN[+m - 1].slice(0, 3)} ${y}` : s; };
const fmtDateLong = s => { if (!s) return '-'; const [y, m, d] = String(s).split('-'); return `${+d} ${BULAN[+m - 1]} ${y}`; };
const fmtPeriod = p => { if (!p) return '-'; const [y, m] = p.split('-'); return `${BULAN[+m - 1]} ${y}`; };
const addMonths = (p, n) => { let [y, m] = p.split('-').map(Number); m += n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return `${y}-${pad(m)}`; };
const dayName = s => HARI[new Date(s + 'T00:00:00').getDay()];
const initials = n => String(n || '?').trim().split(/\s+/).slice(0, 2).map(x => x[0]).join('').toUpperCase();
const sum = (arr, f) => arr.reduce((a, x) => a + (Number(f(x)) || 0), 0);
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const rand4 = () => String(Math.floor(1000 + Math.random() * 9000));
function waNum(n) { n = String(n || '').replace(/\D/g, ''); if (n.startsWith('0')) n = '62' + n.slice(1); else if (n.startsWith('8')) n = '62' + n; return n; }
function waLink(n, text) { return `https://wa.me/${waNum(n)}?text=${encodeURIComponent(text)}`; }
function openWa(n, text) { if (!waNum(n)) return toast('Nomor WhatsApp belum diisi', true); window.open(waLink(n, text), '_blank'); }
function formData(form) { const o = {}; new FormData(form).forEach((v, k) => o[k] = String(v).trim()); return o; }
function monthOptions(sel, back = 12, fwd = 1) {
  const cur = thisPeriod(); let out = '';
  for (let i = fwd; i >= -back; i--) { const p = addMonths(cur, i); out += `<option value="${p}" ${p === sel ? 'selected' : ''}>${fmtPeriod(p)}</option>`; }
  return out;
}
function downloadFile(name, content, type = 'text/csv;charset=utf-8') {
  try {
    const blob = new Blob(['﻿' + content], { type });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e) { toast('Unduhan tidak didukung di tampilan ini', true); }
}
function toCSV(rows) { return rows.map(r => r.map(v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`).join(',')).join('\n'); }

/* ---------------- UI primitives ---------------- */
let toastT;
function toast(msg, err) {
  let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', 2800);
}
let loadingN = 0;
function loading(on) {
  loadingN += on ? 1 : -1; if (loadingN < 0) loadingN = 0;
  let l = $('#loading'); if (!l) { l = document.createElement('div'); l.id = 'loading'; l.className = 'loading hidden'; l.innerHTML = '<div class="spin"></div>'; document.body.appendChild(l); }
  l.classList.toggle('hidden', loadingN === 0);
}
function modal(title, body, foot = '', wide = false) {
  closeModal();
  const m = document.createElement('div'); m.className = 'modal-bg'; m.id = 'modal';
  m.innerHTML = `<div class="modal ${wide ? 'wide' : ''}"><div class="modal-h"><h3>${title}</h3><button class="icon-btn" onclick="closeModal()">${ic('x')}</button></div><div class="modal-b">${body}</div>${foot ? `<div class="modal-f">${foot}</div>` : ''}</div>`;
  m.addEventListener('mousedown', e => { if (e.target === m) closeModal(); });
  document.body.appendChild(m);
  const f = m.querySelector('input:not([type=hidden]),select,textarea'); if (f && window.innerWidth > 700) setTimeout(() => f.focus(), 50);
}
function closeModal() { const m = $('#modal'); if (m) m.remove(); }
function confirmBox(msg, onYes, yesLabel = 'Ya, hapus') {
  window.__yes = () => { closeModal(); onYes(); };
  modal('Konfirmasi', `<p>${msg}</p>`, `<button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn red" onclick="__yes()">${yesLabel}</button>`);
}
function printHtml(inner, title = 'Cetak') {
  const css = $('style').outerHTML;
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(title)}</title><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">${css}<style>body{background:#fff;padding:24px}@media print{body{padding:0}.inv{border:0}}</style></head><body><div style="max-width:720px;margin:0 auto">${inner}</div><script>setTimeout(function(){window.print()},700)<\/script></body></html>`;
  const w = window.open('', '_blank');
  if (w) { w.document.open(); w.document.write(html); w.document.close(); }
  else {
    const d = document.createElement('div'); d.className = 'print-area'; d.innerHTML = inner; document.body.appendChild(d);
    window.print(); setTimeout(() => d.remove(), 500);
  }
}

function LV() {

const ST_COLOR = { Hadir: '#18A058', Izin: '#2F7BEA', Sakit: '#F59E0B', Alpa: '#E5484D' };
function barChart(days) {
  if (!days.length) return '<div class="empty">Belum ada data absensi</div>';
  const W = 560, H = 210, pl = 26, pb = 28, pt = 10, keys = ['Hadir', 'Izin', 'Sakit', 'Alpa'];
  const max = Math.max(4, ...days.flatMap(d => keys.map(k => d[k] || 0)));
  const step = Math.ceil(max / 4), top = step * 4;
  const gw = (W - pl - 6) / days.length, bw = Math.max(5, Math.min(14, (gw - 14) / 4));
  const y = v => pt + (H - pt - pb) * (1 - v / top);
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = step * i; g += `<line x1="${pl}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" stroke="#F1E6EE"/><text x="${pl - 6}" y="${y(v) + 4}" font-size="10" text-anchor="end" fill="#8E8BA6">${v}</text>`; }
  days.forEach((d, i) => {
    const x0 = pl + gw * i + (gw - bw * 4 - 6) / 2;
    keys.forEach((k, j) => { const v = d[k] || 0; if (v) g += `<rect x="${x0 + j * (bw + 2)}" y="${y(v)}" width="${bw}" height="${y(0) - y(v)}" rx="3" fill="${ST_COLOR[k]}"><title>${k}: ${v}</title></rect>`; });
    g += `<text x="${pl + gw * i + gw / 2}" y="${H - 8}" font-size="10.5" text-anchor="middle" fill="#5A5775">${esc(d.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Grafik kehadiran">${g}</svg><div class="legend" style="justify-content:center;margin-top:6px">${keys.map(k => `<span><i style="background:${ST_COLOR[k]}"></i>${k}</span>`).join('')}</div>`;
}
function donut(parts, center, sub) {
  const total = parts.reduce((a, p) => a + p.v, 0) || 1, R = 52, C = 2 * Math.PI * R;
  let off = 0, arcs = '';
  parts.forEach(p => { const len = C * p.v / total; if (p.v) arcs += `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${p.color}" stroke-width="18" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`; off += len; });
  return `<svg viewBox="0 0 140 140" width="150" height="150"><circle cx="70" cy="70" r="${R}" fill="none" stroke="#F3ECF1" stroke-width="18"/>${arcs}<text x="70" y="68" text-anchor="middle" font-size="15" font-weight="700" fill="#2D2A4A">${esc(center)}</text><text x="70" y="86" text-anchor="middle" font-size="10" fill="#8E8BA6">${esc(sub)}</text></svg>`;

/* data admin diperbarui otomatis dari Google Sheet (agar input guru langsung terlihat) */
let lastLoad = Date.now(), refreshing = false;
async function refreshData(silent = true) {
  if (refreshing) return false; refreshing = true;
  try {
    const r = await call('bootstrap', {}, { silent });
    S.db = r.data.db; S.settings = r.data.settings; lastLoad = Date.now();
    if (S.absDraft && !S.absDraft._dirty) S.absDraft = null;
    if (S.gDraft && !S.gDraft._dirty) S.gDraft = null;
    return true;
  } catch (e) { return false; } finally { refreshing = false; }
}
function safeRerender(p) {
  const a = document.activeElement;
  if (S.role === 'admin' && S.page === p && !$('#modal') && !(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName))) renderAdmin();
}
function go(p) {
  S.page = p; renderAdmin(); window.scrollTo(0, 0);
  if (Date.now() - lastLoad > 10000) refreshData().then(ok => ok && safeRerender(p));
}
setInterval(() => { if (S.role === 'admin' && document.visibilityState === 'visible' && Date.now() - lastLoad > 60000) refreshData().then(ok => ok && safeRerender(S.page)); }, 15000);
function renderPage() {
  const nav = NAV.find(n => n[0] === S.page) || NAV[0];
  $('#pageTitle').textContent = nav[1];
  const fn = { menu: pgMenu, dashboard: pgDashboard, siswa: pgSiswa, jadwal: pgJadwal, absensi: pgAbsensi, spp: pgSPP, belajar: pgBelajar, bintang: pgBintang, laporan: pgLaporan, guru: pgGuru, gaji: pgGaji, harian: belHarian, pengaturan: pgPengaturan }[S.page];
  $('#page').innerHTML = fn();
}
const rerender = () => { if (S.role === 'admin') renderAdmin(); };
function tabs(key, items, def) {
  const cur = S.tab[key] || def;
  return `<div class="row"><div class="tabs">${items.map(([k, l]) => `<button class="${cur === k ? 'on' : ''}" onclick="S.tab['${key}']='${k}';renderPage()">${l}</button>`).join('')}</div></div>`;
}
const setF = (k, v) => { S.f[k] = v; renderPage(); };

function siswaList() {

  if (!rows.length) return '<div class="empty">Belum ada data siswa</div>';
  return `<table class="t"><thead><tr><th>ID</th><th>Nama</th><th>Level</th><th>Orang tua</th><th>Mulai</th><th>Status</th><th>SPP ${BULAN[+p.slice(5) - 1].slice(0, 3)}</th><th></th></tr></thead><tbody>
  ${rows.map(s => { const paid = payOf(s.id, p); const billed = billedIn(s, p); return `<tr class="${billed && !paid ? 'unpaid' : ''}">
    <td class="num"><b>${esc(s.id)}</b></td>
    <td><b>${esc(s.nama)}</b><div class="small muted">${esc(s.panggilan || '')} · ${s.jk === 'L' ? 'Laki-laki' : 'Perempuan'}${s.tglLahir ? ' · ' + fmtDate(s.tglLahir) : ''}</div></td>

  </tr>`; }).join('')}</tbody></table>`;
}

/* ================= ABSENSI SISWA ================= */
function pgAbsensi() {
  const t = S.tab.abs || 'input';
  return tabs('abs', [['input', 'Input Harian'], ['rekap', 'Rekap Bulanan']], 'input') + (t === 'input' ? absInput() : absRekap());
}
function absInput() {
  const date = S.f.absDate || todayStr(), hari = dayName(date);
  const groups = sesiGroups(D('Jadwal'), hari);
  const js = S.f.absJadwal || 'all';
  const grp = groups.find(g => g.key === js);
  const jad = grp ? (grp.items.find(j => splitIds(j.siswaIds).length) || grp.items[0]) : null;
  let list = siswaAktif();
  if (grp) list = list.filter(s => grp.ids.includes(s.id));
  const existing = D('Absensi').filter(a => a.tanggal === date);
  if (!S.absDraft || S.absDraft._date !== date) {
    S.absDraft = { _date: date };
    existing.forEach(a => S.absDraft[a.siswaId] = { status: a.status, catatan: a.catatan, id: a.id });
  }
  const cnt = k => list.filter(s => (S.absDraft[s.id] || {}).status === k).length;
  return `<div class="card">
    <div class="card-head">
      <div class="field"><label>Tanggal</label><input class="input" type="date" value="${date}" onchange="S.f.absJadwal='all';setF('absDate',this.value)"></div>
      <div class="field"><label>Sesi (${hari})</label><select class="input" style="max-width:420px" onchange="setF('absJadwal',this.value)"><option value="all">Semua siswa aktif</option>${groups.map(g => `<option value="${g.key}" ${js === g.key ? 'selected' : ''}>Sesi ${esc(g.sesi)} · ${esc(g.jamMulai)}–${esc(g.jamSelesai)} · ${g.ids.length ? esc(namaList(g.ids, snm)) : '(belum ada siswa)'}</option>`).join('')}</select></div>
      <div class="field"><label>Pengajar</label><select class="input" id="absGuru">${D('Guru').map(g => `<option value="${g.id}" ${jad && jad.guruId === g.id ? 'selected' : ''}>${esc(g.nama)}</option>`).join('')}</select></div>
      <div class="spacer"></div>
      <button class="btn ghost" onclick="absAll()">✓ Semua Hadir</button>
    </div>
    <div class="row small" style="margin-bottom:6px"><span class="badge b-green">Hadir ${cnt('Hadir')}</span><span class="badge b-blue">Izin ${cnt('Izin')}</span><span class="badge b-yellow">Sakit ${cnt('Sakit')}</span><span class="badge b-red">Alpa ${cnt('Alpa')}</span><span class="muted">${existing.length ? '· sudah ada data tersimpan untuk tanggal ini' : ''}</span></div>
    <div class="table-wrap"><table class="t"><thead><tr><th>Siswa</th><th>Status</th><th>Keterangan</th><th></th></tr></thead><tbody>
      ${list.map(s => { const d = S.absDraft[s.id] || {}; return `<tr><td><b>${esc(s.nama)}</b><div class="small muted">${esc(s.id)} · Level ${esc(s.level)}</div></td>
      <td><div class="seg">${Object.entries(ST).map(([k, v]) => `<button class="${k} ${d.status === v ? 'on' : ''}" title="${v}" onclick="absSet('${s.id}','${v}')">${k}</button>`).join('')}</div></td>
      <td><input class="input" style="min-width:150px;padding:7px 10px" placeholder="opsional" value="${esc(d.catatan || '')}" onchange="absNote('${s.id}',this.value)"></td><td>${d.id ? `<button class="icon-btn" title="Hapus absensi ini" onclick="delAbs('${d.id}')">${ic('trash')}</button>` : ''}</td></tr>`; }).join('') || `<tr><td colspan="4"><div class="empty">${grp ? 'Belum ada siswa di jadwal sesi ini. <a href="#" onclick="go(\'jadwal\');return false">Tambahkan siswa di menu Jadwal Les →</a>' : 'Tidak ada siswa aktif'}</div></td></tr>`}
    </tbody></table></div>
    <div class="row" style="margin-top:14px"><span class="small muted">H = Hadir · I = Izin · S = Sakit · A = Tanpa keterangan</span><div class="spacer"></div><button class="btn" onclick="absSave()">Simpan Absensi</button></div>
  </div>`;
}
function absSet(id, v) { S.absDraft._dirty = true; S.absDraft[id] = Object.assign(S.absDraft[id] || {}, { status: v }); renderPage(); }
function absNote(id, v) { S.absDraft._dirty = true; S.absDraft[id] = Object.assign(S.absDraft[id] || {}, { catatan: v }); }
function absAll() { const date = S.f.absDate || todayStr(); const grp = sesiGroups(D('Jadwal'), dayName(date)).find(g => g.key === S.f.absJadwal); let list = siswaAktif(); if (grp) list = list.filter(s => grp.ids.includes(s.id)); list.forEach(s => { if (!(S.absDraft[s.id] || {}).status) absSetQuiet(s.id, 'Hadir'); }); renderPage(); }
function absSetQuiet(id, v) { S.absDraft._dirty = true; S.absDraft[id] = Object.assign(S.absDraft[id] || {}, { status: v }); }
async function absSave() {
  const date = S.f.absDate || todayStr(), guruId = ($('#absGuru') || {}).value || '';
  const rows = Object.entries(S.absDraft).filter(([k, v]) => k !== '_date' && v.status).map(([sid, v]) => ({ id: v.id || '', tanggal: date, siswaId: sid, status: v.status, guruId, catatan: v.catatan || '' }));
  if (!rows.length) return toast('Belum ada status yang dipilih', true);
  rows.forEach(r => { if (!r.id) delete r.id; });
  try { const saved = await saveRows('Absensi', rows); saved.forEach(r => S.absDraft[r.siswaId].id = r.id); S.absDraft._dirty = false; toast(`Absensi ${fmtDate(date)} tersimpan (${saved.length} siswa)`); renderPage(); } catch (e) { toast(e.message, true); }
}
function absRekap() {
  const p = S.f.absP || thisPeriod();
  const rows = D('Siswa').filter(s => isAktif(s) || D('Absensi').some(a => a.siswaId === s.id && a.tanggal.startsWith(p))).sort((a, b) => a.nama.localeCompare(b.nama)).map(s => ({ s, c: absMonth(s.id, p) }));
  return `<div class="card"><div class="card-head"><select class="input" style="max-width:200px" onchange="setF('absP',this.value)">${monthOptions(p)}</select><div class="spacer"></div><button class="btn ghost" onclick="csvAbs('${p}')">${ic('download')} Unduh Excel (CSV)</button></div>
  <div class="table-wrap"><table class="t"><thead><tr><th>Siswa</th><th class="c">Hadir</th><th class="c">Izin</th><th class="c">Sakit</th><th class="c">Alpa</th><th class="c">Pertemuan</th><th class="c">% Hadir</th></tr></thead><tbody>
  ${rows.map(({ s, c }) => `<tr style="cursor:pointer" onclick="absDetail('${s.id}','${p}')"><td><b>${esc(s.nama)}</b><div class="small muted">${esc(s.id)}</div></td><td class="c num cell-ok">${c.Hadir}</td><td class="c num">${c.Izin}</td><td class="c num">${c.Sakit}</td><td class="c num ${c.Alpa ? 'cell-no' : ''}">${c.Alpa}</td><td class="c num"><b>${c.total}</b></td><td class="c num">${c.total ? Math.round(c.Hadir / c.total * 100) + '%' : '-'}</td></tr>`).join('') || '<tr><td colspan="7"><div class="empty">Belum ada data</div></td></tr>'}
  </tbody></table></div></div>`;
}
function delAbs(id, after) {
  const a = D('Absensi').find(x => x.id === id); if (!a) return;
  confirmBox(`Hapus absensi <b>${esc(siswaById(a.siswaId).nama)}</b> tanggal ${fmtDate(a.tanggal)}?`, async () => {
    try { await removeRow('Absensi', id); if (S.absDraft && S.absDraft[a.siswaId] && S.absDraft[a.siswaId].id === id) delete S.absDraft[a.siswaId]; toast('Absensi dihapus'); after ? after() : renderPage(); } catch (e) { toast(e.message, true); }

function absDetail(sid, p) {
  const c = absMonth(sid, p); const s = siswaById(sid);
  modal(`${esc(s.nama)} — ${fmtPeriod(p)}`, c.rows.length ? `<table class="t"><tbody>${c.rows.sort((a, b) => a.tanggal.localeCompare(b.tanggal)).map(r => `<tr><td>${dayName(r.tanggal)}, ${fmtDate(r.tanggal)}</td><td><span class="badge ${{ Hadir: 'b-green', Izin: 'b-blue', Sakit: 'b-yellow', Alpa: 'b-red' }[r.status]}">${r.status}</span></td><td class="small muted">${esc(r.catatan || '')}<span class="small"> ${r.guruId ? '· ' + esc(guruById(r.guruId).nama) : ''}</span></td><td class="r"><button class="icon-btn" title="Hapus" onclick="delAbs('${r.id}',()=>{renderPage();absDetail('${sid}','${p}')})">${ic('trash')}</button></td></tr>`).join('')}</tbody></table>` : '<div class="empty">Belum ada absensi</div>');

function csvAbs(p) {

/* ================= SPP ================= */
function pgSPP() {
  const t = S.tab.spp || 'tagihan';
  return `<div class="row">${tabs('spp', [['tagihan', 'Tagihan Bulanan'], ['rekap', 'Rekap Lunas / Belum'], ['riwayat', 'Riwayat Pembayaran']], 'tagihan')}<div class="spacer"></div><button class="btn" onclick="formBayar()">${ic('plus')} Catat Pembayaran</button></div>` +
    (t === 'tagihan' ? sppTagihan() : t === 'rekap' ? sppRekap() : sppRiwayat());
}
function sppTagihan() {
  const p = S.f.sppP || thisPeriod(), flt = S.f.sppFilter || 'belum';
  const billed = siswaAktif().filter(s => billedIn(s, p));
  const paid = D('SPP').filter(x => x.periode === p);
  const unpaid = billed.filter(s => !payOf(s.id, p));
  const extra = paid.filter(x => !billed.find(s => s.id === x.siswaId)).map(x => siswaById(x.siswaId));
  let rows = billed.concat(extra);
  if (flt === 'belum') rows = unpaid; else if (flt === 'lunas') rows = rows.filter(s => payOf(s.id, p));
  rows.sort((a, b) => (!!payOf(a.id, p) - !!payOf(b.id, p)) || a.nama.localeCompare(b.nama));
  const totalTag = sum(billed, s => sppNominal(s, S.settings));
  return `<div class="grid g3">
    <div class="stat bg-blue"><span class="lbl">Total tagihan ${fmtPeriod(p)}</span><span class="val num">${rp(totalTag)}</span><span class="sub">${billed.length} siswa aktif</span></div>
    <div class="stat bg-green"><span class="lbl">Sudah bayar</span><span class="val num" style="color:#0E7A41">${rp(sum(paid, x => x.nominal))}</span><span class="sub">${paid.length} siswa lunas</span></div>
    <div class="stat bg-red"><span class="lbl" style="color:#B4282D">Belum bayar</span><span class="val num" style="color:var(--red)">${rp(sum(unpaid, s => sppNominal(s, S.settings)))}</span><span class="sub">${unpaid.length} siswa · jatuh tempo ${fmtDate(dueDate(p, S.settings))}</span></div>
  </div>
  <div class="card">
    <div class="card-head">
      <select class="input" style="max-width:190px" onchange="setF('sppP',this.value)">${monthOptions(p)}</select>
      <div class="chips">${[['belum', `Belum bayar (${unpaid.length})`], ['lunas', `Lunas (${paid.length})`], ['semua', 'Semua']].map(([k, l]) => `<button class="chip ${flt === k ? 'on' : ''}" onclick="setF('sppFilter','${k}')">${l}</button>`).join('')}</div>
      <div class="spacer"></div>
      ${unpaid.length ? `<button class="btn wa" onclick="massReminder('${p}')">${ic('wa')} Kirim Pengingat (${unpaid.length})</button>` : ''}
    </div>
    <div class="table-wrap"><table class="t"><thead><tr><th>Siswa</th><th>Orang tua</th><th class="r">Nominal</th><th>Status</th><th>Pembayaran</th><th></th></tr></thead><tbody>
    ${rows.map(s => { const x = payOf(s.id, p); return `<tr class="${x ? '' : 'unpaid'}">
      <td><b>${esc(s.nama)}</b><div class="small muted">${esc(s.id)}</div></td>
      <td>${esc(s.ortu || '-')}<div class="small muted">${esc(s.waOrtu || '')}</div></td>
      <td class="r num"><b>${rp(x ? x.nominal : sppNominal(s, S.settings))}</b></td>
      <td>${x ? '<span class="badge b-green">✓ Lunas</span>' : '<span class="badge b-red">● Belum bayar</span>'}</td>
      <td class="small">${x ? `${fmtDate(x.tanggalBayar)} · ${esc(x.metode)}` : '<span class="muted">—</span>'}</td>
      <td class="nowrap r">${x
        ? `<button class="btn sm ghost" onclick="showInvoice('${s.id}','${p}')">${ic('file')} Kwitansi</button><button class="icon-btn" title="Kirim bukti WA" onclick="waInvoice('${s.id}','${p}')">${ic('wa')}</button><button class="icon-btn" title="Batalkan" onclick="delBayar('${x.id}')">${ic('trash')}</button>`
        : `<button class="btn sm green" onclick="formBayar('${s.id}','${p}')">Catat Bayar</button> <button class="btn sm ghost" onclick="showInvoice('${s.id}','${p}')">${ic('file')} Invoice</button><button class="icon-btn" title="Kirim invoice WA" onclick="waInvoice('${s.id}','${p}')">${ic('wa')}</button>`}</td>
    </tr>`; }).join('') || `<tr><td colspan="6"><div class="empty">${flt === 'belum' ? '🎉 Semua siswa sudah membayar' : 'Tidak ada data'}</div></td></tr>`}
    </tbody></table></div>
  </div>`;
}
function showInvoice(sid, p) {
  const s = siswaById(sid), x = payOf(sid, p);
  modal(x ? 'Kwitansi Pembayaran' : 'Invoice Tagihan SPP', invoiceHtml(s, p, x, S.settings),
    `<button class="btn ghost" onclick="printHtml($('#modal .inv').outerHTML,'${x ? 'Kwitansi' : 'Invoice'} ${esc(s.nama)}')">${ic('print')} Cetak / PDF</button>

function waInvoice(sid, p) { const s = siswaById(sid); openWa(s.waOrtu, invoiceWaText(s, p, payOf(sid, p), S.settings)); }
function massReminder(p) {

function formBayar(sid, p) {

  modal('Catat Pembayaran SPP', `<form id="fBayar" class="form-grid" onsubmit="event.preventDefault();saveBayar()">
    <div class="field full"><label>Siswa</label>${s ? `<input type="hidden" name="siswaId" value="${s.id}"><div class="input" style="background:#FAF6F9"><b>${esc(s.nama)}</b> · ${esc(s.id)}</div>` : `<select class="input" name="siswaId" required onchange="const x=siswaById(this.value);$('#fBayar [name=nominal]').value=sppNominal(x,S.settings)"><option value="">— pilih siswa —</option>${D('Siswa').filter(x => x.status !== 'Berhenti').sort((a, b) => a.nama.localeCompare(b.nama)).map(x => `<option value="${x.id}">${esc(x.nama)} (${x.id})</option>`).join('')}</select>`}</div>

    <div class="field"><label>Nominal</label><input class="input" name="nominal" inputmode="numeric" required value="${s ? sppNominal(s, S.settings) : S.settings.nominalSPP}"></div>

  </form>`, `<button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn green" onclick="$('#fBayar').requestSubmit()">Simpan Pembayaran</button>`);
}
async function saveBayar() {

function delBayar(id) { confirmBox('Batalkan/hapus catatan pembayaran ini? Status akan kembali menjadi belum bayar.', async () => { await removeRow('SPP', id); toast('Pembayaran dihapus'); renderAdmin(); }); }
function sppRekap() {
  const y = S.f.sppY || thisPeriod().slice(0, 4), cur = thisPeriod();
  const months = Array.from({ length: 12 }, (_, i) => `${y}-${pad(i + 1)}`);
  const list = D('Siswa').filter(s => isAktif(s) || D('SPP').some(x => x.siswaId === s.id && x.periode.startsWith(y))).sort((a, b) => a.nama.localeCompare(b.nama));
  let grand = 0, grandN = 0, paidTot = 0;
  const body = list.map(s => {
    let n = 0, tot = 0;
    const cells = months.map(m => {
      const x = payOf(s.id, m);
      if (x) { paidTot += +x.nominal || 0; return `<td class="c cell-ok" title="${fmtDate(x.tanggalBayar)} · ${rp(x.nominal)}">✓</td>`; }
      if (billedIn(s, m) && m <= cur) { n++; tot += sppNominal(s, S.settings); return `<td class="c cell-no" title="Belum bayar">✗</td>`; }
      return `<td class="c cell-na">·</td>`;
    }).join('');
    grand += tot; grandN += n;
    return `<tr class="${n ? 'unpaid' : ''}"><td class="nowrap"><b>${esc(s.nama)}</b></td>${cells}<td class="c num">${n ? `<b style="color:var(--red)">${n} bln</b>` : '<span class="cell-ok">Lunas</span>'}</td><td class="r num">${n ? rp(tot) : '-'}</td></tr>`;
  }).join('');
  return `<div class="grid g3"><div class="stat bg-green"><span class="lbl">Terbayar tahun ${y}</span><span class="val num">${rp(paidTot)}</span></div>
    <div class="stat bg-red"><span class="lbl" style="color:#B4282D">Total tunggakan</span><span class="val num" style="color:var(--red)">${rp(grand)}</span><span class="sub">${grandN} bulan belum dibayar</span></div>
    <div class="stat bg-yellow"><span class="lbl">Siswa menunggak</span><span class="val num">${list.filter(s => months.some(m => billedIn(s, m) && m <= cur && !payOf(s.id, m))).length}</span><span class="sub">dari ${list.length} siswa</span></div></div>
  <div class="card"><div class="card-head"><select class="input" style="max-width:130px" onchange="setF('sppY',this.value)">${[+y - 1, +y, +y + 1].map(v => `<option ${v == y ? 'selected' : ''}>${v}</option>`).join('')}</select><span class="small muted">✓ lunas · <span style="color:var(--red)">✗ belum bayar</span> · · belum ditagih</span><div class="spacer"></div><button class="btn ghost" onclick="csvSpp('${y}')">${ic('download')} Unduh Excel (CSV)</button></div>
  <div class="table-wrap"><table class="t"><thead><tr><th>Siswa</th>${months.map(m => `<th class="c">${BULAN[+m.slice(5) - 1].slice(0, 3)}</th>`).join('')}<th class="c">Tunggakan</th><th class="r">Jumlah</th></tr></thead><tbody>${body || '<tr><td colspan="15"><div class="empty">Belum ada data</div></td></tr>'}</tbody></table></div></div>`;
}
function csvSpp(y) {
  const months = Array.from({ length: 12 }, (_, i) => `${y}-${pad(i + 1)}`), cur = thisPeriod();
  const rows = [['ID', 'Nama', ...months.map(m => fmtPeriod(m)), 'Bulan Tunggakan', 'Total Tunggakan']];
  D('Siswa').filter(isAktif).forEach(s => {
    let n = 0, t = 0;
    const c = months.map(m => { const x = payOf(s.id, m); if (x) return 'LUNAS ' + x.nominal; if (billedIn(s, m) && m <= cur) { n++; t += sppNominal(s, S.settings); return 'BELUM'; } return '-'; });
    rows.push([s.id, s.nama, ...c, n, t]);
  });
  downloadFile(`Rekap-SPP-${y}.csv`, toCSV(rows));
}
function sppRiwayat() {
  const q = (S.f.rq || '').toLowerCase();
  const rows = [...D('SPP')].filter(x => !q || siswaById(x.siswaId).nama.toLowerCase().includes(q)).sort((a, b) => (b.tanggalBayar || '').localeCompare(a.tanggalBayar || ''));
  return `<div class="card"><div class="card-head"><input class="input" style="max-width:240px" placeholder="Cari nama siswa…" value="${esc(S.f.rq || '')}" onchange="setF('rq',this.value)"><div class="spacer"></div><span class="muted small">${rows.length} transaksi · ${rp(sum(rows, x => x.nominal))}</span></div>
  <div class="table-wrap"><table class="t"><thead><tr><th>Tanggal</th><th>No. Kwitansi</th><th>Siswa</th><th>Periode</th><th>Metode</th><th class="r">Nominal</th><th></th></tr></thead><tbody>
  ${rows.slice(0, 300).map(x => `<tr><td class="nowrap">${fmtDate(x.tanggalBayar)}</td><td class="small num">${esc(x.noInvoice)}</td><td><b>${esc(siswaById(x.siswaId).nama)}</b></td><td>${fmtPeriod(x.periode)}</td><td>${esc(x.metode)}</td><td class="r num"><b>${rp(x.nominal)}</b></td><td class="nowrap"><button class="icon-btn" onclick="showInvoice('${x.siswaId}','${x.periode}')">${ic('file')}</button><button class="icon-btn" onclick="delBayar('${x.id}')">${ic('trash')}</button></td></tr>`).join('') || '<tr><td colspan="7"><div class="empty">Belum ada pembayaran</div></td></tr>'}
  </tbody></table></div></div>`;
}

/* ================= SOAL & LEVEL ================= */
function pgBelajar() {
  const t = S.tab.bel || 'soal';
  return tabs('bel', [['soal', 'Bank Soal'], ['level', 'Level Siswa'], ['hasil', 'Hasil Latihan']], 'soal') +
    (t === 'soal' ? belSoal() : t === 'level' ? belLevel() : belHasil());
}
function belLevel() {
  const counts = [1, 2, 3, 4].map(l => siswaAktif().filter(s => +s.level === l).length);
  return `<div class="grid g4">${LV().map((l, i) => `<div class="stat" style="background:${l.bg}"><span class="lbl">${esc(l.judul)}</span><span class="val num">${counts[i]}</span><span class="sub">${esc(l.desc)}</span></div>`).join('')}</div>
  <div class="card"><h3>Level siswa</h3><p class="small muted" style="margin:-4px 0 10px">Level menentukan soal latihan yang terbuka di Portal Orang Tua. Rekomendasi naik level muncul bila rata-rata skor ≥ 85 dari minimal 3 latihan di level saat ini.</p>
  <div class="table-wrap"><table class="t"><thead><tr><th>Siswa</th><th>Level</th><th class="c">Latihan</th><th class="c">Rata-rata (level ini)</th><th class="c">Skor terakhir</th><th class="c">⭐</th><th>Rekomendasi</th></tr></thead><tbody>
  ${siswaAktif().map(s => { const n = D('Nilai').filter(x => x.siswaId === s.id); const nl = n.filter(x => +x.level === +s.level); const avg = nl.length ? Math.round(sum(nl, x => x.skor) / nl.length) : null; const last = [...n].sort((a, b) => b.tanggal.localeCompare(a.tanggal))[0];
    const ready = avg !== null && avg >= 85 && nl.length >= 3 && +s.level < 4;
    return `<tr><td><b>${esc(s.nama)}</b><div class="small muted">${esc(s.id)}</div></td>
    <td><select class="input" style="padding:6px 10px;width:auto" onchange="setLevel('${s.id}',this.value)">${LV().map(l => `<option value="${l.n}" ${+s.level === l.n ? 'selected' : ''}>${esc(l.judul)}</option>`).join('')}</select></td>
    <td class="c num">${n.length}</td><td class="c num">${avg === null ? '-' : `<b>${avg}</b>`}</td><td class="c num">${last ? `${last.skor} <span class="small muted">(L${last.level})</span>` : '-'}</td><td class="c num">${starTotal(s.id)}</td>
    <td>${ready ? `<button class="btn sm yellow" onclick="setLevel('${s.id}',${+s.level + 1})">⬆ Naik ke Level ${+s.level + 1}</button>` : '<span class="small muted">—</span>'}</td></tr>`; }).join('') || '<tr><td colspan="7"><div class="empty">Belum ada siswa aktif</div></td></tr>'}
  </tbody></table></div></div>`;
}
async function setLevel(id, lv) { const s = siswaById(id); try { await saveRow('Siswa', { ...s, level: String(lv) }); toast(`${s.nama} sekarang Level ${lv}`); renderPage(); } catch (e) { toast(e.message, true); } }
function belHasil() {
  const sid = S.f.hSid || '', lv = S.f.hLv || '';
  const rows = [...D('Nilai')].filter(x => (!sid || x.siswaId === sid) && (!lv || x.level == lv)).sort((a, b) => b.tanggal.localeCompare(a.tanggal));

    <select class="input" style="max-width:240px" onchange="setF('hSid',this.value)"><option value="">Semua siswa</option>${D('Siswa').map(s => `<option value="${s.id}" ${sid === s.id ? 'selected' : ''}>${esc(s.nama)}</option>`).join('')}</select>
    <select class="input" style="max-width:140px" onchange="setF('hLv',this.value)"><option value="">Semua level</option>${[1, 2, 3, 4].map(l => `<option ${lv == l ? 'selected' : ''} value="${l}">Level ${l}</option>`).join('')}</select>
    <div class="spacer"></div><span class="small muted">${rows.length} latihan · rata-rata ${rows.length ? Math.round(sum(rows, x => x.skor) / rows.length) : '-'}</span></div>
  <div class="table-wrap"><table class="t"><thead><tr><th>Tanggal</th><th>Siswa</th><th>Level</th><th class="c">Benar</th><th class="c">Skor</th><th class="c">Waktu</th><th class="c">Bintang</th></tr></thead><tbody>
  ${rows.slice(0, 300).map(x => `<tr><td class="nowrap">${fmtDate(x.tanggal)}</td><td><b>${esc(siswaById(x.siswaId).nama)}</b></td><td>${lvBadge(x.level)}</td><td class="c num">${esc(x.benar)}/${esc(x.total)}</td><td class="c num"><b style="color:${+x.skor >= 75 ? 'var(--green)' : +x.skor >= 60 ? 'var(--yellow-d)' : 'var(--red)'}">${esc(x.skor)}</b></td><td class="c num">${Math.floor(x.durasi / 60)}:${pad(x.durasi % 60)}</td><td class="c">${'⭐'.repeat(+x.bintang || 0) || '-'}</td></tr>`).join('') || '<tr><td colspan="7"><div class="empty">Belum ada hasil latihan</div></td></tr>'}
  </tbody></table></div></div>`;
}

/* ---------- bank soal (diisi admin, per level & jurus) ---------- */
function normSoal(t) {
  return String(t).replace(/=.*$/, '').replace(/\s*[xX*×]\s*/g, ' × ').replace(/\s*[:/÷]\s*/g, ' ÷ ').replace(/\s*\+\s*/g, ' + ').replace(/\s*[-−–]\s*/g, ' − ').replace(/\s+/g, ' ').trim();
}
function jurusSelect(L, sel, name = 'jurus') {
  return `<select class="input" name="${name}">${L.jurusList.map(j => `<option ${sel === j ? 'selected' : ''}>${esc(j)}</option>`).join('')}<option value="" ${sel === '' && L.jurusList.length ? '' : ''}>(tanpa jurus)</option></select>`;
}
function belSoal() {
  const lv = S.f.sLv || '1', L = lvOf(lv), jf = S.f.sJur || '';
  const all = D('Soal').filter(x => x.level == lv);
  const rows = all.filter(x => !jf || x.jurus === jf);
  return `<div class="card" style="background:${L.bg}"><div class="row"><div class="avatar" style="width:44px;height:44px;background:${L.color};color:#fff;font-size:20px">${lv}</div><div style="flex:1;min-width:200px"><h3 style="margin:0">${esc(L.judul)}</h3><div class="small">${esc(L.desc)} · Jurus: <b>${L.jurusList.map(esc).join(', ') || '-'}</b></div></div><button class="btn sm ghost" onclick="go('pengaturan')">Ubah nama level / jurus</button></div></div>
  <div class="card"><div class="card-head"><div class="chips">${LV().map(l => `<button class="chip ${lv == l.n ? 'on' : ''}" onclick="S.f.sJur='';setF('sLv','${l.n}')">Level ${l.n} (${D('Soal').filter(x => x.level == l.n).length})</button>`).join('')}</div></div>
  <p class="small muted" style="margin-bottom:12px">Latihan di Portal Orang Tua <b>hanya memakai soal dari bank ini</b>, diacak, ${esc(S.settings.soalPerLatihan || 10)} soal per latihan. Jawaban terisi otomatis dari soal (bisa diubah). Penulisan: <b>+ − × ÷</b> atau <b>+ - x :</b></p>
  <form id="fSoal" class="row" onsubmit="event.preventDefault();addSoal('${lv}')" style="margin-bottom:12px;align-items:flex-end">
    <div class="field" style="min-width:140px"><label>Jurus</label>${jurusSelect(L, jf || L.jurusList[0] || '')}</div>
    <div class="field" style="flex:2;min-width:170px"><label>Soal</label><input class="input" name="soal" placeholder="contoh: 4 + 1   atau   7 + 5 − 3" required oninput="this.form.jawaban.value=hitungSoal(this.value)"></div>
    <div class="field" style="flex:1;min-width:90px"><label>Jawaban</label><input class="input" name="jawaban" required inputmode="numeric"></div>
    <button class="btn">${ic('plus')} Tambah</button>
    <button type="button" class="btn ghost" onclick="formSoalMassal('${lv}')">Tambah banyak sekaligus</button>
  </form>
  <div class="chips" style="margin-bottom:8px"><button class="chip ${!jf ? 'on' : ''}" onclick="setF('sJur','')">Semua (${all.length})</button>${L.jurusList.map(j => `<button class="chip ${jf === j ? 'on' : ''}" onclick="setF('sJur','${esc(j)}')">${esc(j)} (${all.filter(x => x.jurus === j).length})</button>`).join('')}</div>
  <div class="table-wrap"><table class="t"><thead><tr><th>Soal</th><th>Jawaban</th><th>Jurus</th><th>Aktif</th><th></th></tr></thead><tbody>
  ${rows.map(x => `<tr><td style="font-family:var(--font-h);font-size:18px">${esc(x.soal)}</td><td class="num"><b>${esc(x.jawaban)}</b></td><td>${x.jurus ? `<span class="badge b-pink">${esc(x.jurus)}</span>` : '-'}</td><td><button class="badge ${x.aktif === 'Tidak' ? 'b-gray' : 'b-green'}" onclick="toggleSoal('${x.id}')">${x.aktif === 'Tidak' ? 'Nonaktif' : 'Aktif'}</button></td><td class="r nowrap"><button class="icon-btn" onclick="editSoal('${x.id}')">${ic('edit')}</button><button class="icon-btn" onclick="delSoal('${x.id}')">${ic('trash')}</button></td></tr>`).join('') || '<tr><td colspan="5"><div class="empty">Belum ada soal di sini. Latihan level ini belum bisa dipakai orang tua sampai soal ditambahkan.</div></td></tr>'}
  </tbody></table></div></div>`;
}
async function addSoal(lv) {
  const f = formData($('#fSoal')); const soal = normSoal(f.soal);
  if (!soal || f.jawaban === '') return toast('Lengkapi soal & jawaban', true);
  try { await saveRow('Soal', { level: lv, soal, jawaban: f.jawaban, aktif: 'Ya', jurus: f.jurus }); S.f.sJur = f.jurus; toast('Soal ditambahkan'); renderPage(); setTimeout(() => { const el = $('#fSoal [name=soal]'); if (el) el.focus(); }, 30); } catch (e) { toast(e.message, true); }
}
function formSoalMassal(lv) {
  const L = lvOf(lv);
  modal(`Tambah banyak soal — ${esc(L.judul)}`, `<form id="fMass" class="form-grid" onsubmit="event.preventDefault();saveSoalMassal('${lv}')">
    <div class="field full"><label>Jurus</label>${jurusSelect(L, S.f.sJur || L.jurusList[0] || '')}</div>
    <div class="field full"><label>Daftar soal — satu soal per baris</label><textarea class="input" name="list" style="min-height:220px;font-family:var(--font-h);font-size:17px" placeholder="4 + 1\n3 + 1 − 2\n5 − 4\n2 + 2 = 4"></textarea>
    <span class="small muted">Jawaban dihitung otomatis. Boleh juga tulis jawabannya sendiri setelah tanda <b>=</b>.</span></div>
  </form>`, `<button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn" onclick="$('#fMass').requestSubmit()">Simpan Semua</button>`, true);
}
async function saveSoalMassal(lv) {
  const f = formData($('#fMass'));
  const rows = [], bad = [];
  f.list.split(/\n/).map(x => x.trim()).filter(Boolean).forEach(line => {
    const m = line.split('='); const soal = normSoal(m[0]); const jawab = (m[1] || '').trim() || hitungSoal(m[0]);
    if (soal && jawab !== '') rows.push({ level: lv, soal, jawaban: jawab, aktif: 'Ya', jurus: f.jurus }); else bad.push(line);
  });
  if (!rows.length) return toast('Tidak ada soal yang valid', true);
  try { await saveRows('Soal', rows); closeModal(); S.f.sJur = f.jurus; toast(`${rows.length} soal ditambahkan${bad.length ? ` · ${bad.length} baris dilewati` : ''}`); renderPage(); } catch (e) { toast(e.message, true); }
}
function editSoal(id) {
  const x = D('Soal').find(s => s.id === id), L = lvOf(x.level);
  modal('Edit Soal', `<form id="fES" class="form-grid" onsubmit="event.preventDefault();saveEditSoal('${id}')">
    <div class="field"><label>Level</label><select class="input" name="level">${LV().map(l => `<option value="${l.n}" ${+x.level === l.n ? 'selected' : ''}>${esc(l.judul)}</option>`).join('')}</select></div>
    <div class="field"><label>Jurus</label><select class="input" name="jurus">${[...new Set(LV().flatMap(l => l.jurusList))].map(j => `<option ${x.jurus === j ? 'selected' : ''}>${esc(j)}</option>`).join('')}<option value="" ${!x.jurus ? 'selected' : ''}>(tanpa jurus)</option></select></div>
    <div class="field"><label>Soal</label><input class="input" name="soal" value="${esc(x.soal)}" oninput="this.form.jawaban.value=hitungSoal(this.value)"></div>
    <div class="field"><label>Jawaban</label><input class="input" name="jawaban" value="${esc(x.jawaban)}"></div>
  </form>`, `<button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn" onclick="$('#fES').requestSubmit()">Simpan</button>`);
}
async function saveEditSoal(id) { const f = formData($('#fES')); const x = D('Soal').find(s => s.id === id); try { await saveRow('Soal', { ...x, ...f, soal: normSoal(f.soal) }); closeModal(); renderPage(); } catch (e) { toast(e.message, true); } }
async function toggleSoal(id) { const x = D('Soal').find(s => s.id === id); await saveRow('Soal', { ...x, aktif: x.aktif === 'Tidak' ? 'Ya' : 'Tidak' }); renderPage(); }
function delSoal(id) { confirmBox('Hapus soal ini?', async () => { await removeRow('Soal', id); renderPage(); }); }

    <div class="field"><label>Jurus</label><select class="input" name="jurus"><option value="">-</option>${[...new Set(LV().flatMap(l => l.jurusList))].map(j => `<option ${x.jurus === j ? 'selected' : ''}>${esc(j)}</option>`).join('')}</select></div>
    <div class="field full"><label>Deskripsi perkembangan</label><textarea class="input" name="deskripsi" required>${esc(x.deskripsi)}</textarea></div>
  </form>`, `<button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn" onclick="$('#fPH').requestSubmit()">Simpan</button>`);

async function saveHarian(id) { const f = formData($('#fPH')); try { await saveRow('Perkembangan', Object.assign(id ? { id } : {}, f)); closeModal(); toast('Tersimpan'); renderPage(); } catch (e) { toast(e.message, true); } }
function delHarian(id) { confirmBox('Hapus catatan ini?', async () => { await removeRow('Perkembangan', id); renderPage(); }); }

/* ================= BINTANG & REWARD ================= */
function pgBintang() {
  const list = siswaAktif().map(s => ({ s, t: starTotal(s.id) })).sort((a, b) => b.t - a.t);

function formBintang(sid, tipe = 'Bonus') {
  const tukar = tipe === 'Tukar';
  modal(tukar ? '🎁 Tukar Bintang dengan Hadiah' : '⭐ Beri Bintang', `<form id="fBin" class="form-grid" onsubmit="event.preventDefault();saveBintang('${tipe}')">

async function saveBintang(tipe) {
  const f = formData($('#fBin')); let j = Math.abs(+f.jumlah || 0);
  if (!j) return toast('Jumlah tidak valid', true);
  if (tipe === 'Tukar') { if (j > starTotal(f.siswaId)) return toast('Saldo bintang tidak cukup', true); j = -j; f.keterangan = 'Tukar: ' + f.keterangan; }
  try { await saveRow('Bintang', { ...f, jumlah: String(j), tipe }); closeModal(); toast('Tersimpan'); renderPage(); } catch (e) { toast(e.message, true); }
}
function delBintang(id) { confirmBox('Hapus catatan bintang ini?', async () => { await removeRow('Bintang', id); renderPage(); }); }

/* ================= LAPORAN BULANAN ================= */
function lapAuto(s, p) {
  const c = absMonth(s.id, p);
  const n = D('Nilai').filter(x => x.siswaId === s.id && x.tanggal.startsWith(p));
  const b = sum(D('Bintang').filter(x => x.siswaId === s.id && x.tanggal.startsWith(p) && +x.jumlah > 0), x => x.jumlah);
  return { level: s.level, hadir: String(c.Hadir), pertemuan: String(c.total || S.settings.pertemuanPerBulan || 8), rataNilai: n.length ? String(Math.round(sum(n, x => x.skor) / n.length)) : '', bintang: String(b) };
}
function pgLaporan() {
  const p = S.f.lapP || thisPeriod();
  const list = siswaAktif();
  const done = list.filter(s => D('Laporan').some(l => l.siswaId === s.id && l.periode === p)).length;
  return `<div class="card"><div class="card-head"><select class="input" style="max-width:200px" onchange="setF('lapP',this.value)">${monthOptions(p)}</select><span class="badge ${done === list.length && list.length ? 'b-green' : 'b-yellow'}">${done}/${list.length} laporan dibuat</span><div class="spacer"></div><span class="small muted">Kehadiran, nilai & bintang terisi otomatis.</span></div>
  <div class="table-wrap"><table class="t"><thead><tr><th>Siswa</th><th class="c">Kehadiran</th><th class="c">Rata nilai</th><th class="c">⭐ bulan ini</th><th>Status</th><th></th></tr></thead><tbody>
  ${list.map(s => { const l = D('Laporan').find(x => x.siswaId === s.id && x.periode === p); const a = l || lapAuto(s, p); return `<tr>
    <td><b>${esc(s.nama)}</b><div class="small muted">${esc(s.id)} · Level ${esc(a.level)}</div></td>
    <td class="c num">${esc(a.hadir)}/${esc(a.pertemuan)}</td><td class="c num">${esc(a.rataNilai || '-')}</td><td class="c num">${esc(a.bintang)}</td>
    <td>${l ? '<span class="badge b-green">Sudah dibuat</span>' : '<span class="badge b-gray">Belum</span>'}</td>
    <td class="nowrap r">${l ? `<button class="icon-btn" title="Lihat / cetak" onclick="viewLaporan('${l.id}')">${ic('print')}</button><button class="icon-btn" title="Kirim WA" onclick="waLaporan('${l.id}')">${ic('wa')}</button><button class="btn sm ghost" onclick="formLaporan('${s.id}','${p}')">Edit</button>` : `<button class="btn sm" onclick="formLaporan('${s.id}','${p}')">Buat laporan</button>`}</td></tr>`; }).join('') || '<tr><td colspan="6"><div class="empty">Belum ada siswa aktif</div></td></tr>'}
  </tbody></table></div></div>`;
}
function formLaporan(sid, p) {
  const s = siswaById(sid), l = D('Laporan').find(x => x.siswaId === sid && x.periode === p), a = l || lapAuto(s, p);
  modal(`Laporan ${esc(s.nama)} — ${fmtPeriod(p)}`, `<form id="fLap" class="form-grid" onsubmit="event.preventDefault();saveLaporan('${sid}','${p}','${l ? l.id : ''}')">
    <div class="field"><label>Level / jurus</label><select class="input" name="level">${LV().map(x => `<option value="${x.n}" ${+a.level === x.n ? 'selected' : ''}>${x.judul}</option>`).join('')}</select></div>

    ${(() => { const n = D('Perkembangan').filter(x => x.siswaId === sid && x.tanggal.startsWith(p)).sort((a, b) => a.tanggal.localeCompare(b.tanggal)); return n.length ? `<div class="full" style="background:var(--yellow-50);border-radius:12px;padding:10px 12px"><b class="small">Catatan perkembangan harian dari guru bulan ini:</b>${n.map(x => `<div class="small" style="margin-top:4px">• <b>${fmtDate(x.tanggal)}</b>${x.jurus ? ' [' + esc(x.jurus) + ']' : ''} — ${esc(x.deskripsi)} <span class="muted">(${esc(guruById(x.guruId).nama)})</span></div>`).join('')}</div>` : ''; })()}
  </form>`, `<button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn" onclick="$('#fLap').requestSubmit()">Simpan Laporan</button>`, true);

async function saveLaporan(sid, p, id) {
  const f = formData($('#fLap'));
  try { const r = await saveRow('Laporan', Object.assign(id ? { id } : {}, f, { siswaId: sid, periode: p, dibuat: todayStr() })); closeModal(); toast('Laporan tersimpan'); renderPage(); viewLaporan(r.id); } catch (e) { toast(e.message, true); }
}

function viewLaporan(id) {

/* ================= GURU ================= */
function pgGuru() {
  const t = S.tab.guru || 'data';
  return tabs('guru', [['data', 'Data Guru'], ['hadir', 'Kehadiran Guru'], ['rekap', 'Rekap Jam Mengajar']], 'data') + (t === 'data' ? guruData() : t === 'hadir' ? guruHadir() : guruRekap());
}
function jamDiff(a, b) { if (!a || !b) return ''; const [h1, m1] = a.split(':').map(Number), [h2, m2] = b.split(':').map(Number); const d = (h2 * 60 + m2 - h1 * 60 - m1) / 60; return d > 0 ? String(Math.round(d * 2) / 2) : ''; }
function guruHadir() {
  const date = S.f.gDate || todayStr(), hari = dayName(date);
  const gs = D('Guru').filter(g => g.status !== 'Nonaktif');
  if (!S.gDraft || S.gDraft._date !== date) {
    S.gDraft = { _date: date };
    D('AbsensiGuru').filter(a => a.tanggal === date).forEach(a => S.gDraft[a.guruId] = { ...a });
  }
  return `<div class="card"><div class="card-head"><div class="field"><label>Tanggal</label><input class="input" type="date" value="${date}" onchange="setF('gDate',this.value)"></div><div class="spacer"></div><span class="small muted">${hari}</span></div>
  ${gs.length ? `<div class="table-wrap"><table class="t"><thead><tr><th>Guru</th><th>Status</th><th>Jam masuk</th><th>Jam keluar</th><th>Jam mengajar</th><th>Catatan</th><th></th></tr></thead><tbody>
  ${gs.map(g => { const d = S.gDraft[g.id] || {}; const sesi = D('Jadwal').filter(j => j.hari === hari && j.guruId === g.id).length; return `<tr>
    <td><b>${esc(g.nama)}</b><div class="small muted">${sesi} sesi terjadwal hari ini</div></td>
    <td><div class="seg">${Object.entries(ST).map(([k, v]) => `<button class="${k} ${d.status === v ? 'on' : ''}" onclick="gSet('${g.id}','status','${v}',true)">${k}</button>`).join('')}</div></td>
    <td><input class="input" type="time" style="padding:7px 9px" value="${esc(d.jamMasuk || '')}" onchange="gSet('${g.id}','jamMasuk',this.value)"></td>
    <td><input class="input" type="time" style="padding:7px 9px" value="${esc(d.jamKeluar || '')}" onchange="gSet('${g.id}','jamKeluar',this.value)"></td>
    <td><input class="input" id="jm_${g.id}" inputmode="decimal" style="padding:7px 9px;width:80px" value="${esc(d.jamMengajar || '')}" onchange="gSet('${g.id}','jamMengajar',this.value)"></td>
    <td><input class="input" style="padding:7px 9px;min-width:120px" value="${esc(d.catatan || '')}" onchange="gSet('${g.id}','catatan',this.value)"></td><td>${d.id ? `<button class="icon-btn" title="Hapus" onclick="delAbsGuru('${d.id}')">${ic('trash')}</button>` : ''}</td></tr>`; }).join('')}
  </tbody></table></div>
  <div class="row" style="margin-top:14px"><span class="small muted">Jam mengajar terisi otomatis dari jam masuk–keluar (bisa diubah).</span><div class="spacer"></div><button class="btn" onclick="gSave()">Simpan Kehadiran Guru</button></div>`
    : `<div class="empty">Belum ada data guru. Tambahkan di tab <b>Data Guru</b>.</div>`}</div>`;
}
function gSet(id, k, v, re) {
  S.gDraft._dirty = true;
  const d = S.gDraft[id] = Object.assign(S.gDraft[id] || {}, { [k]: v });
  if (k === 'status' && v === 'Hadir' && !d.jamMasuk) { const n = new Date(); d.jamMasuk = `${pad(n.getHours())}:${pad(n.getMinutes())}`; }
  if (k === 'jamMasuk' || k === 'jamKeluar') { const j = jamDiff(d.jamMasuk, d.jamKeluar); if (j) { d.jamMengajar = j; const el = $('#jm_' + id); if (el) el.value = j; } }
  if (re) renderPage();
}
function delAbsGuru(id) {
  const a = D('AbsensiGuru').find(x => x.id === id); if (!a) return;
  confirmBox(`Hapus kehadiran <b>${esc(guruById(a.guruId).nama)}</b> tanggal ${fmtDate(a.tanggal)}?`, async () => {
    try { await removeRow('AbsensiGuru', id); if (S.gDraft) delete S.gDraft[a.guruId]; toast('Dihapus'); renderPage(); } catch (e) { toast(e.message, true); }
  });
}
async function gSave() {
  const date = S.f.gDate || todayStr();
  const rows = Object.entries(S.gDraft).filter(([k, v]) => k !== '_date' && v.status).map(([gid, v]) => { const r = { tanggal: date, guruId: gid, status: v.status, jamMasuk: v.jamMasuk || '', jamKeluar: v.jamKeluar || '', jamMengajar: v.status === 'Hadir' ? (v.jamMengajar || '') : '0', catatan: v.catatan || '' }; if (v.id) r.id = v.id; return r; });
  if (!rows.length) return toast('Pilih status kehadiran guru dulu', true);
  try { const saved = await saveRows('AbsensiGuru', rows); saved.forEach(r => S.gDraft[r.guruId].id = r.id); S.gDraft._dirty = false; toast('Kehadiran guru tersimpan'); renderPage(); } catch (e) { toast(e.message, true); }
}
function guruRekap() {
  const p = S.f.gP || thisPeriod();
  const rows = D('Guru').map(g => { const r = D('AbsensiGuru').filter(a => a.guruId === g.id && a.tanggal.startsWith(p)); const c = k => r.filter(x => x.status === k).length; return { g, H: c('Hadir'), I: c('Izin'), S: c('Sakit'), A: c('Alpa'), jam: sum(r, x => x.jamMengajar), sesi: D('Jadwal').filter(j => j.guruId === g.id).length, siswa: new Set(D('Jadwal').filter(j => j.guruId === g.id).flatMap(j => j.siswaIds.split(',').filter(Boolean))).size }; });
  return `<div class="card"><div class="card-head"><select class="input" style="max-width:200px" onchange="setF('gP',this.value)">${monthOptions(p)}</select><div class="spacer"></div><button class="btn ghost" onclick="csvGuru('${p}')">${ic('download')} Unduh Excel (CSV)</button></div>
  <div class="table-wrap"><table class="t"><thead><tr><th>Guru</th><th class="c">Hadir</th><th class="c">Izin</th><th class="c">Sakit</th><th class="c">Alpa</th><th class="c">Total jam mengajar</th><th class="c">Sesi/minggu</th><th class="c">Siswa diajar</th></tr></thead><tbody>
  ${rows.map(r => `<tr><td><b>${esc(r.g.nama)}</b></td><td class="c num cell-ok">${r.H}</td><td class="c num">${r.I}</td><td class="c num">${r.S}</td><td class="c num ${r.A ? 'cell-no' : ''}">${r.A}</td><td class="c num"><b>${r.jam} jam</b></td><td class="c num">${r.sesi}</td><td class="c num">${r.siswa}</td></tr>`).join('') || '<tr><td colspan="8"><div class="empty">Belum ada data</div></td></tr>'}
  </tbody></table></div></div>`;
}
function csvGuru(p) {
  const rows = [['Guru', 'Tanggal', 'Status', 'Jam Masuk', 'Jam Keluar', 'Jam Mengajar', 'Catatan']];
  D('AbsensiGuru').filter(a => a.tanggal.startsWith(p)).sort((a, b) => a.tanggal.localeCompare(b.tanggal)).forEach(a => rows.push([guruById(a.guruId).nama, a.tanggal, a.status, a.jamMasuk, a.jamKeluar, a.jamMengajar, a.catatan]));
  downloadFile(`Kehadiran-Guru-${p}.csv`, toCSV(rows));
}

/* ================= REKAP GAJI GURU ================= */
function gajiCalc(g, p) {
  const r = D('AbsensiGuru').filter(a => a.guruId === g.id && a.tanggal.startsWith(p));
  const hadir = r.filter(x => x.status === 'Hadir').length, jam = sum(r, x => x.jamMengajar);
  const tarif = +g.tarif || 0, tipe = g.tipeTarif || 'Per kehadiran';
  const pokok = tipe === 'Per jam' ? Math.round(tarif * jam) : tipe === 'Bulanan tetap' ? tarif : tarif * hadir;
  const rec = D('Gaji').find(x => x.guruId === g.id && x.periode === p);
  const bonus = +(rec && rec.bonus) || 0, pot = +(rec && rec.potongan) || 0;
  return { hadir, izin: r.filter(x => x.status !== 'Hadir').length, jam, tarif, tipe, pokok, bonus, pot, total: pokok + bonus - pot, rec, paid: !!(rec && rec.tanggalBayar) };
}

  const p = S.f.gjP || thisPeriod();

  return `<div class="grid g3">

    <div class="stat bg-green"><span class="lbl">Sudah dibayar</span><span class="val num" style="color:#0E7A41">${rp(paid)}</span><span class="sub">${rows.filter(r => r.c.paid).length} guru</span></div>
    <div class="stat bg-red"><span class="lbl" style="color:#B4282D">Belum dibayar</span><span class="val num" style="color:var(--red)">${rp(tot - paid)}</span><span class="sub">${rows.filter(r => !r.c.paid).length} guru</span></div></div>
  <div class="card"><div class="card-head"><select class="input" style="max-width:200px" onchange="setF('gjP',this.value)">${monthOptions(p)}</select><span class="small muted">Dihitung dari menu Kehadiran Guru × tarif di Data Guru</span><div class="spacer"></div><button class="btn ghost" onclick="csvGaji('${p}')">${ic('download')} Unduh Excel (CSV)</button></div>
  <div class="table-wrap"><table class="t"><thead><tr><th>Guru</th><th>Cara hitung</th><th class="c">Hadir</th><th class="c">Jam</th><th class="r">Gaji pokok</th><th class="r">Bonus</th><th class="r">Potongan</th><th class="r">Total</th><th>Status</th><th></th></tr></thead><tbody>
  ${rows.map(({ g, c }) => `<tr class="${c.paid ? '' : 'unpaid'}"><td><b>${esc(g.nama)}</b><div class="small muted">${esc(g.id)}</div></td>
    <td class="small nowrap">${esc(c.tipe)}<br><span class="muted">${rp(c.tarif)}</span></td><td class="c num">${c.hadir}</td><td class="c num">${c.jam}</td>
    <td class="r num">${rp(c.pokok)}</td><td class="r num">${c.bonus ? rp(c.bonus) : '-'}</td><td class="r num">${c.pot ? '−' + rp(c.pot) : '-'}</td><td class="r num"><b>${rp(c.total)}</b></td>
    <td>${c.paid ? `<span class="badge b-green">✓ Dibayar</span><div class="small muted">${fmtDate(c.rec.tanggalBayar)}</div>` : '<span class="badge b-red">Belum</span>'}</td>
    <td class="nowrap r">${c.paid ? `<button class="icon-btn" title="Batalkan status dibayar" onclick="bayarGaji('${g.id}','${p}',false)">${ic('x')}</button>` : `<button class="btn sm green" onclick="bayarGaji('${g.id}','${p}',true)">Bayar</button>`}<button class="icon-btn" title="Bonus / potongan" onclick="formGaji('${g.id}','${p}')">${ic('edit')}</button><button class="icon-btn" title="Slip gaji" onclick="slipGaji('${g.id}','${p}')">${ic('file')}</button></td></tr>`).join('') || '<tr><td colspan="10"><div class="empty">Belum ada data guru</div></td></tr>'}
