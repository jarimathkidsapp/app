  if (scope === 'mine' || !scope) return all.filter(s => s.diajar);
  const g = gSesi(dayName(date || todayStr())).find(x => x.key === scope);
  if (!g) return all.filter(s => s.diajar);
  return all.filter(s => g.ids.includes(s.id));
}

  const g = S.g.guru, today = todayStr(), hari = dayName(today);
  const me = S.g.AbsensiGuru.find(a => a.tanggal === today);
  const jHari = gSesi(hari);

  const idsHari = [...new Set(jHari.flatMap(g => g.ids))];
  const absHari = S.g.Absensi.filter(a => a.tanggal === today && (idsHari.includes(a.siswaId) || a.guruId === g.id));
  const notesHari = S.g.Perkembangan.filter(p => p.tanggal === today && p.guruId === g.id);

let Q = null;
function startQuiz(level, jurus) {
  const items = buildQuiz(level, S.me.Soal, jurus || '');

  renderQuiz();
  clearInterval(Q.timer); Q.timer = setInterval(() => { const el = $('#qTimer'); if (el && Q) el.textContent = fmtSec((Date.now() - Q.t0) / 1000); else if (Q) clearInterval(Q.timer); }, 1000);
}
const fmtSec = s => `${Math.floor(s / 60)}:${pad(Math.floor(s % 60))}`;
function renderQuiz(state = '') {
  const it = Q.items[Q.i], L = lvOf(Q.level);
  $('#app').innerHTML = kidTop(L.judul + (Q.jurus ? ' · ' + Q.jurus : '')) + `<div class="kid-wrap"><div class="quiz">

    <div class="dots">${Q.items.map((_, k) => `<i class="${k < Q.res.length ? (Q.res[k] ? 'ok' : 'no') : k === Q.i ? 'cur' : ''}"></i>`).join('')}</div>
    <div class="q-box ${state}"><div class="q-text" style="${it.q.length > 14 ? 'font-size:34px' : ''}">${esc(it.q)} = ?</div><div class="q-ans" id="qAns">${esc(Q.ans) || '&nbsp;'}</div>
      ${state === 'wrong' ? `<div style="margin-top:8px;font-weight:800;color:var(--red)">Jawaban yang benar: ${esc(it.ans)}</div>` : state === 'right' ? '<div style="margin-top:8px;font-weight:800;color:var(--green)">Hebat! Benar 🎉</div>' : ''}</div>
    <div class="keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button onclick="qKey('${n}')">${n}</button>`).join('')}<button class="del" onclick="qKey('del')">⌫</button><button onclick="qKey('0')">0</button><button class="ok" onclick="qKey('ok')">✓</button></div>
  </div></div>`;

function qKey(k) {
  if (!Q || Q.lock) return;
  if (k === 'del') Q.ans = Q.ans.slice(0, -1);
  else if (k === 'ok') return qSubmit();
  else if (Q.ans.length < 6) Q.ans += k;

}
function qSubmit() {
  if (!Q.ans) return;
  const ok = Q.ans.replace(/^0+(?=\d)/, '') === String(Q.items[Q.i].ans).replace(/^0+(?=\d)/, '');
  Q.res.push(ok); Q.lock = true;
  renderQuiz(ok ? 'right' : 'wrong');
  setTimeout(() => { if (!Q) return; Q.lock = false; Q.i++; Q.ans = ''; Q.i >= Q.items.length ? finishQuiz() : renderQuiz(); }, ok ? 700 : 1600);
}

async function finishQuiz() {

    <div class="grid g-chart">
      <div class="card"><div class="card-head"><h3>Ringkasan kehadiran</h3><div class="spacer"></div><button class="btn sm ghost" onclick="oTab('absen')">Detail</button></div>
        ${barChart([3, 2, 1, 0].map(n => addMonths(p, -n)).map(m => { const r = S.me.Absensi.filter(a => a.tanggal.startsWith(m)); const o = { label: BULAN[+m.slice(5) - 1].slice(0, 3) }; ['Hadir', 'Izin', 'Sakit', 'Alpa'].forEach(k => o[k] = r.filter(x => x.status === k).length); return o; }).filter((o, i, arr) => i === arr.length - 1 || o.Hadir + o.Izin + o.Sakit + o.Alpa))}
      </div>
      <div class="card"><h3>Informasi penting</h3>
        ${(() => { const hari = dayName(todayStr()); const jn = S.me.Jadwal.find(j => j.hari === hari); return `<div class="li"><div class="avatar" style="background:var(--green-50)">📅</div><div class="meta"><b>${jn ? `Les hari ini ${esc(jn.jamMulai)}–${esc(jn.jamSelesai)}` : 'Tidak ada les hari ini'}</b><span class="small muted">${S.me.Jadwal.map(j => j.hari + ' ' + j.jamMulai).join(' · ') || 'Jadwal belum diatur'}</span></div></div>`; })()}
        <div class="li"><div class="avatar" style="background:var(--blue-50)">📄</div><div class="meta"><b>${laps[0] ? 'Laporan ' + fmtPeriod(laps[0].periode) : 'Laporan bulanan belum ada'}</b><span class="small muted">${laps[0] ? 'Klik untuk melihat & cetak' : 'Dikirim admin tiap akhir bulan'}</span></div>${laps[0] ? `<button class="btn sm ghost" onclick="ortuLap('${laps[0].id}')">Lihat</button>` : ''}</div>
        <div class="li"><div class="avatar" style="background:${unpaid.length ? 'var(--red-50)' : 'var(--green-50)'}">💳</div><div class="meta"><b style="color:${unpaid.length ? 'var(--red)' : 'inherit'}">${unpaid.length ? `SPP belum dibayar (${unpaid.length} bln)` : 'SPP lunas'}</b><span class="small muted">${unpaid.length ? rp(unpaid.length * sppNominal(s, st)) : fmtPeriod(p)}</span></div><button class="btn sm ghost" onclick="oTab('spp')">Buka</button></div>
      </div>
    </div>
    <div class="grid g2">
      <div class="card"><div class="card-head"><h3>Perkembangan harian</h3><div class="spacer"></div>${harian.length > 3 ? `<button class="btn sm ghost" onclick="oTab('harian')">Semua</button>` : ''}</div>${harian.slice(0, 3).map(harianItem).join('') || '<div class="empty">Belum ada catatan dari guru</div>'}</div>
      <div class="card"><h3>Jadwal les</h3>${S.me.Jadwal.map(j => `<div class="li"><div class="avatar" style="background:var(--green-50)">${esc(j.hari.slice(0, 2))}</div><div class="meta"><b>${esc(j.hari)}, ${esc(j.jamMulai)}–${esc(j.jamSelesai)}</b><span class="small muted">${esc(j.tipe)} · ${esc(j.guruNama)}</span></div></div>`).join('') || '<div class="empty">Belum ada jadwal</div>'}
        ${laps[0] ? `<h4 style="margin:12px 0 4px">Laporan terbaru</h4><div class="li"><div class="meta"><b>${fmtPeriod(laps[0].periode)}</b></div><button class="btn sm" onclick="ortuLap('${laps[0].id}')">Lihat</button></div>` : ''}</div>
    </div>`;
  } else if (t === 'spp') {
    const all = [...new Set(periods.concat(S.me.SPP.map(x => x.periode)))].sort().reverse();
    body = `<div class="card"><div class="card-head"><h3>Status SPP</h3><div class="spacer"></div><span class="small muted">Nominal ${rp(sppNominal(s, st))}/bulan · jatuh tempo tgl ${esc(st.jatuhTempo)}</span></div>
      <table class="t"><thead><tr><th>Periode</th><th>Status</th><th class="r"></th></tr></thead><tbody>
      ${all.map(per => { const x = pay(per); return `<tr class="${x ? '' : 'unpaid'}"><td><b>${fmtPeriod(per)}</b><div class="small muted">${x ? `Dibayar ${fmtDate(x.tanggalBayar)} · ${esc(x.metode)}` : `Jatuh tempo ${fmtDate(dueDate(per, st))}`}</div></td><td>${x ? '<span class="badge b-green">✓ Lunas</span>' : '<span class="badge b-red">● Belum bayar</span>'}</td><td class="r"><button class="btn sm ${x ? 'ghost' : ''}" onclick="ortuInv('${per}')">${x ? 'Kwitansi' : 'Invoice'}</button></td></tr>`; }).join('') || '<tr><td colspan="3"><div class="empty">Belum ada tagihan</div></td></tr>'}
      </tbody></table>
      <div style="margin-top:14px;background:var(--yellow-50);border-radius:14px;padding:12px 14px" class="small"><b>Cara bayar:</b> transfer ke ${esc(st.rekening || '-')}, lalu kirim bukti ke admin.<div style="margin-top:8px"><button class="btn sm wa" onclick="ortuWaBayar('')">${ic('wa')} Konfirmasi ke Admin</button></div></div></div>`;
  } else if (t === 'absen') {
    const per = S.f.oP || p; const rows = S.me.Absensi.filter(a => a.tanggal.startsWith(per)).sort((a, b) => b.tanggal.localeCompare(a.tanggal));
    const c = k => rows.filter(r => r.status === k).length;
    body = `<div class="card"><div class="card-head"><select class="input" style="max-width:200px" onchange="S.f.oP=this.value;renderOrtu()">${monthOptions(per, 12, 0)}</select></div>
      <div class="row" style="margin-bottom:10px"><span class="badge b-green">Hadir ${c('Hadir')}</span><span class="badge b-blue">Izin ${c('Izin')}</span><span class="badge b-yellow">Sakit ${c('Sakit')}</span><span class="badge b-red">Alpa ${c('Alpa')}</span></div>
      ${rows.map(r => `<div class="li"><div class="meta"><b>${dayName(r.tanggal)}, ${fmtDateLong(r.tanggal)}</b>${r.catatan ? `<span class="small muted">${esc(r.catatan)}</span>` : ''}</div><span class="badge ${stCls[r.status]}">${r.status}</span></div>`).join('') || '<div class="empty">Belum ada absensi di bulan ini</div>'}</div>`;
  } else if (t === 'harian') {
    body = `<div class="card"><h3>Perkembangan harian dari guru</h3>${harian.map(harianItem).join('') || '<div class="empty">Belum ada catatan dari guru</div>'}</div>`;
  } else if (t === 'lap') {
    body = `<div class="card"><h3>Laporan bulanan</h3>${laps.map(l => `<div class="li"><div class="avatar" style="background:var(--blue-50)">📄</div><div class="meta"><b>${fmtPeriod(l.periode)}</b><span class="small muted">Hadir ${esc(l.hadir)}/${esc(l.pertemuan)} · nilai ${esc(l.rataNilai || '-')} · ⭐ ${esc(l.bintang)}</span></div><button class="btn sm" onclick="ortuLap('${l.id}')">Lihat / Cetak</button></div>`).join('') || '<div class="empty">Belum ada laporan</div>'}</div>`;
  } else {
    const lv = +s.level || 1;
    const nilai = [...S.me.Nilai].sort((a, b) => b.tanggal.localeCompare(a.tanggal));
    const bin = [...S.me.Bintang].sort((a, b) => b.tanggal.localeCompare(a.tanggal));
    body = `<div class="card" style="background:var(--yellow-50)"><b>✋ Latihan soal Jarimatika</b><p class="small">Pilih level & jurus, lalu ananda menjawab soal memakai jari. Skor ≥ 60 dapat ⭐, ≥ 75 ⭐⭐, ≥ 90 ⭐⭐⭐. Level di atas level ananda masih terkunci.</p></div>
    <div class="levels">${LV().map(Lx => {
      const locked = Lx.n > lv; const bank = S.me.Soal.filter(q => +q.level === Lx.n); const best = Math.max(0, ...nilai.filter(n => +n.level === Lx.n).map(n => +n.skor));
      const jur = Lx.jurusList.filter(j => bank.some(q => q.jurus === j));
      return `<div class="level-card ${locked ? 'locked' : ''}" style="background:${Lx.bg};cursor:default;flex-wrap:wrap">
        ${locked ? '<span class="lock">🔒</span>' : ''}
        <span class="n" style="background:${Lx.color}">${Lx.n}</span>
        <span style="flex:1;min-width:150px;padding-right:22px"><h3>${esc(Lx.nama)}</h3><p>${esc(Lx.desc)}</p><p style="margin-top:4px;font-weight:800;color:var(--ink)">${locked ? 'Terkunci' : !bank.length ? 'Soal belum tersedia' : best ? `Skor terbaik ${best} ${'⭐'.repeat(starsFor(best))}` : `${bank.length} soal siap`}</p></span>
        ${!locked && bank.length ? `<div class="row" style="flex-basis:100%;gap:6px;margin-top:6px"><button class="btn sm" onclick="startQuiz(${Lx.n},'')">Mulai (semua jurus)</button>${jur.length > 1 ? jur.map(j => `<button class="btn sm ghost" onclick="startQuiz(${Lx.n},'${esc(j)}')">${esc(j)}</button>`).join('') : ''}</div>` : ''}
      </div>`; }).join('')}</div>
    <div class="grid g2"><div class="card"><h3>Hasil latihan</h3>${nilai.slice(0, 20).map(n => `<div class="li"><div class="avatar" style="background:${lvOf(n.level).bg}">L${esc(n.level)}</div><div class="meta"><b>Skor ${esc(n.skor)} (${esc(n.benar)}/${esc(n.total)})</b><span class="small muted">${fmtDate(n.tanggal)} · ${Math.floor(n.durasi / 60)}m ${n.durasi % 60}d</span></div><span>${'⭐'.repeat(+n.bintang) || '—'}</span></div>`).join('') || '<div class="empty">Belum ada latihan</div>'}</div>
      <div class="card"><h3>Riwayat bintang</h3>${bin.slice(0, 20).map(b => `<div class="li"><div class="meta"><b>${esc(b.keterangan)}</b><span class="small muted">${fmtDate(b.tanggal)}</span></div><b class="num">${+b.jumlah > 0 ? '+' : ''}${esc(b.jumlah)}</b></div>`).join('') || '<div class="empty">Belum ada</div>'}</div></div>`;
  }
  const O_NAV = [['ringkas', 'Dashboard', 'grid'], ['latihan', 'Latihan Soal', 'calc'], ['harian', 'Perkembangan', 'note'], ['absen', 'Kehadiran', 'check'], ['spp', 'Pembayaran SPP', 'wallet', unpaid.length || ''], ['lap', 'Laporan', 'report']];
  setRoleTheme('ortu');
  const head = `<div class="card" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 18px"><div class="avatar" style="width:52px;height:52px;font-size:20px">${initials(s.nama)}</div><div style="flex:1;min-width:0"><b style="font-family:var(--font-h);font-size:18px">${esc(s.nama)}</b><div class="small muted">${esc(s.id)} · ${esc(L.judul)} · ${stBadge(s.status)}</div></div><span class="star-pill" style="font-size:15px;box-shadow:none">⭐ ${stars}</span></div>`;
  $('#app').innerHTML = shellHtml({ nav: O_NAV, cur: t, goFn: 'oTab', roleName: 'Orang Tua', title: (O_NAV.find(n => n[0] === t) || O_NAV[0])[1], name: s.ortu || s.nama, onRefresh: 'oReload()', body: (t === 'ringkas' ? '' : head) + body });
}
function oTab(k) { S.tab.ortu = k; renderOrtu(); window.scrollTo(0, 0); }
async function oReload() { try { const m = await call('me'); S.me = m.data; renderOrtu(); toast('Data terbaru dimuat'); } catch (e) { toast(e.message, true); } }
function ortuWaBayar(per) {
  const s = S.me.siswa;
  openWa(S.settings.noWa, `Assalamu'alaikum admin, saya orang tua ${s.nama} (${s.id}) ingin konfirmasi pembayaran SPP${per ? ' ' + fmtPeriod(per) : ''}. Berikut bukti transfernya:`);
}
function ortuInv(per) {
  const s = S.me.siswa, x = S.me.SPP.find(v => v.periode === per);
  modal(x ? 'Kwitansi Pembayaran' : 'Invoice SPP', invoiceHtml(s, per, x, S.settings), `<button class="btn ghost" onclick="printHtml($('#modal .inv').outerHTML,'SPP ${fmtPeriod(per)}')">${ic('print')} Cetak / Simpan PDF</button>${x ? '' : `<button class="btn wa" onclick="ortuWaBayar('${per}')">${ic('wa')} Kirim Bukti Bayar</button>`}`, true);
}
function ortuLap(id) {
  const l = S.me.Laporan.find(x => x.id === id), s = S.me.siswa;
  modal('Laporan Bulanan', laporanHtml(s, l, S.settings, S.me.Absensi.filter(a => a.tanggal.startsWith(l.periode))), `<button class="btn" onclick="printHtml($('#modal .inv').outerHTML,'Laporan ${esc(s.nama)}')">${ic('print')} Cetak / Simpan PDF</button>`, true);
}

init();

</script>
</body>
</html>
